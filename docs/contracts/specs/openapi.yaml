        next_after_id:
          type: string
          nullable: true
          description: Cursor for loading an earlier slice using `before_id`.
    # ============================================================================
    # M1: Architecture & Contract Freeze - New Schemas
    # ============================================================================
    AuthorizationRequest:
      type: object
      required:
        - subject
        - action
        - resource
      properties:
        subject:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: [user, group, agent]
            id:
              type: string
        action:
          type: string
          description: e.g., "endpoint.invoke", "project.delete"
          examples:
            - endpoint.invoke
            - project.delete
            - source.file.upload
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: [project, endpoint, source_library, agent]
            id:
              type: string
        context:
          type: object
          properties:
            end_user_id:
              type: string
            metadata:
              type: object
              additionalProperties: true
    AuthorizationResponse:
      type: object
      required:
        - allowed
        - decision
      properties:
        allowed:
          type: boolean
        decision:
          type: object
          required:
            - source
            - reason
          properties:
            source:
              type: string
              enum: [permission, resource_policy, project_default]
            rule_id:
              type: string
            reason:
              type: string
        matched_policy:
          type: object
          properties:
            id:
              type: string
            resource_type:
              type: string
            resource_id:
              type: string
            access_mode:
              type: string
              enum: [allow_all_members, allow_list]
            matched_subject:
              type: object
              properties:
                type:
                  type: string
                  enum: [user, group]
                id:
                  type: string
    QuotaCheckRequest:
      type: object
      required:
        - subject_id
        - resource_type
        - resource_id
        - operation
      properties:
        subject_id:
          type: string
          description: User ID, group ID, or agent ID
        resource_type:
          type: string
          enum: [endpoint, source_library, agent]
        resource_id:
          type: string
        operation:
          type: string
          enum: [invoke, upload, create]
        estimated_cost:
          type: number
          description: Estimated tokens/bytes for the operation
          minimum: 0
    QuotaCheckResponse:
      type: object
      required:
        - allowed
        - quota_remaining
        - quota_limit
        - quota_reset_at
        - policy_id
      properties:
        allowed:
          type: boolean
        quota_remaining:
          type: number
          minimum: 0
        quota_limit:
          type: number
          minimum: 0
        quota_reset_at:
          type: string
          format: date-time
        policy_id:
          type: string
    AuditExportResponse:
      type: object
      required:
        - export_id
        - generated_at
        - time_range
        - filter
        - events
      properties:
        export_id:
          type: string
        generated_at:
          type: string
          format: date-time
        time_range:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        filter:
          type: object
          properties:
            workspace_id:
              type: string
            project_id:
              type: string
            action:
              type: string
            actor_type:
              type: string
            result:
              type: string
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              timestamp:
                type: string
                format: date-time
              workspace_id:
                type: string
              project_id:
                type: string
              actor_type:
                type: string
                enum: [user, agent, plugin]
              actor_id:
                type: string
              action:
                type: string
              resource_type:
                type: string
              resource_id:
                type: string
              end_user_id:
                type: string
              result:
                type: string
                enum: [ok, error]
              error_code:
                type: string
              error_message:
                type: string
              request_id:
                type: string
              metadata_json:
                type: object
                additionalProperties: true
              # Authorization-specific fields (for authorization.* actions)
              authz_subject:
                type: object
                properties:
                  type:
                    type: string
                    enum: [user, group, agent]
                  id:
                    type: string
              authz_action:
                type: string
              authz_resource:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
              authz_decision:
                type: object
                properties:
                  allowed:
                    type: boolean
                  source:
                    type: string
                    enum: [permission, resource_policy, project_default, allow_list]
                  reason:
                    type: string
                  policy_id:
                    type: string
              # Usage-specific fields (for quota.* actions)
              usage_metrics:
                type: object
                properties:
                  quantity:
                    type: number
                  unit:
                    type: string
                    enum: [tokens, bytes, requests, seconds]
              quota_remaining:
                type: number
              quota_limit:
                type: number
              quota_reset_at:
                type: string
                format: date-time
              policy_id:
                type: string
    SSETicketRequest:
