    AlertMetric:
      type: string
      description: Supported alert metrics
      enum:
        - requests_per_day
        - requests_per_hour
        - quota_percent
        - error_rate
        - token_usage
        - response_time_p95
    AlertOperator:
      type: string
      description: Alert comparison operators
      enum: [gt, gte, lt, lte, eq]
    AlertWindow:
      type: string
      description: Time windows for aggregation
      enum: [5m, 15m, 1h, 24h, 7d]
    AlertChannels:
      type: object
      description: Alert notification channels
      required:
        - in_app
      properties:
        in_app:
          type: boolean
          description: Show in UI notification center
        webhook:
          $ref: '#/components/schemas/WebhookConfig'
    WebhookConfig:
      type: object
      description: Webhook configuration for alert notifications
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers for webhook requests
    AlertBehavior:
      type: object
      description: Alert behavior settings
      required:
        - debounce_minutes
        - notify_on_recovery
      properties:
        debounce_minutes:
          type: integer
          minimum: 0
          description: Minimum time between alerts
        notify_on_recovery:
          type: boolean
          description: Send "resolved" notification
    AlertRuleCreateRequest:
      type: object
      description: Create alert rule request
      required:
        - name
        - enabled
        - trigger
        - channels
        - behavior
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AlertTrigger'
        channels:
          $ref: '#/components/schemas/AlertChannels'
        behavior:
          $ref: '#/components/schemas/AlertBehavior'
    AlertRuleUpdateRequest:
      type: object
      description: Update alert rule request (all fields optional)
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AlertTrigger'
        channels:
          $ref: '#/components/schemas/AlertChannels'
        behavior:
          $ref: '#/components/schemas/AlertBehavior'
    AlertRuleTestResponse:
      type: object
      description: Alert rule test response
      required:
        - would_trigger
        - actual_value
        - details
      properties:
        would_trigger:
          type: boolean
          description: Whether the rule would trigger with current data
        actual_value:
          type: number
          description: Current value of the metric being tested
        details:
          type: string
          description: Human-readable explanation of the test result
    AlertNotificationsListResponse:
      type: object
      description: Paginated list of alert notifications
      required:
        - items
        - total
        - page
        - page_size
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertNotification'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_more:
          type: boolean
    AlertNotification:
      type: object
      description: Alert notification (triggered alert instance)
      required:
        - id
        - rule_id
        - rule_name
        - status
        - triggered_at
        - metric
        - operator
        - threshold
        - actual_value
        - context
        - delivery
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        metric:
          $ref: '#/components/schemas/AlertMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        actual_value:
          type: number
        context:
          $ref: '#/components/schemas/AlertContext'
        delivery:
          $ref: '#/components/schemas/AlertDelivery'
    AlertStatus:
      type: string
      description: Alert notification status
      enum: [firing, resolved, silenced]
    AlertContext:
      type: object
      description: Alert context information
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        resource_name:
          type: string
        end_user_id:
          type: string
    AlertDelivery:
      type: object
      description: Alert delivery status
      required:
        - in_app_sent
        - webhook_sent
      properties:
        in_app_sent:
          type: boolean
        in_app_seen_at:
          type: string
          format: date-time
        webhook_sent:
          type: boolean
        webhook_status:
          type: integer
          description: HTTP status code from webhook delivery
        webhook_error:
          type: string
          description: Error message if webhook delivery failed
    SilenceNotificationRequest:
      type: object
      description: Silence notification request
      properties:
        duration_minutes:
          type: integer
          minimum: 1
          description: Duration in minutes. If omitted, silence indefinitely.
    AlertRulesListResponse:
      type: object
      description: Paginated list of alert rules
      required:
        - items
        - total
        - page
        - page_size
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_more:
          type: boolean
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authorization
