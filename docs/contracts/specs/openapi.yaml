            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/events:
    get:
      tags:
      - Notebook
      operationId: listTaskEvents
      description: Server-Sent Events stream for notebook task runtime updates (message/task_update/error/ping).
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/traces:
    get:
      summary: List notebook execution trace events
      description: 'Returns execution trace events for a notebook task. Results can
        be scoped to a specific message or run,

        and paged using cursor-style parameters (`after_id` / `before_id`).

        '
      tags:
      - Notebook
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: path
        name: taskId
        required: true
        schema:
          type: string
      - in: query
        name: message_id
        schema:
          type: string
        description: Limit traces to a specific agent message.
      - in: query
        name: run_id
        schema:
          type: string
        description: Limit traces to a specific runtime execution.
      - in: query
        name: after_id
        schema:
          type: string
        description: Return events newer than the given trace event id (gap-fill /
          tail paging).
      - in: query
        name: before_id
        schema:
          type: string
        description: Return events older than the given trace event id (load earlier
          logs).
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
        description: Maximum number of events to return.
      responses:
        '200':
          description: Trace event list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - task_id
                      - message_id
                      - run_id
                      - seq
                      - at
                      - category
                      - name
                      - summary
                      properties:
                        id:
                          type: string
                        task_id:
                          type: string
                        message_id:
                          type: string
                        run_id:
                          type: string
                        seq:
                          type: integer
                          minimum: 0
                        at:
                          type: string
                          format: date-time
                        category:
                          type: string
                          enum:
                          - lifecycle
                          - progress
                          - tool
                          - artifact
                          - warning
                          - error
                          - debug
                        phase:
                          type: string
                          enum:
                          - start
                          - update
                          - end
                        status:
                          type: string
                          enum:
                          - running
                          - success
                          - error
                          - cancelled
                        name:
                          type: string
                        summary:
                          type: string
                        details:
                          type: object
                          additionalProperties: true
                          description: Sanitized structured detail payload (no secrets/tokens).
                  total:
                    type: integer
                    minimum: 0
                  has_more:
                    type: boolean
                    description: Indicates older events are available for pagination.
                  next_after_id:
                    type: string
                    nullable: true
                    description: Cursor for loading an earlier slice using `before_id`.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found
