name: agentsmith-unified-substrate

x-substrate-internal-proxy-env: &substrate-internal-proxy-env
  NO_PROXY: ${SUBSTRATE_INTERNAL_NO_PROXY:-postgresql,mongodb,redis,minio,keycloak,localhost,127.0.0.1,::1}
  no_proxy: ${SUBSTRATE_INTERNAL_NO_PROXY:-postgresql,mongodb,redis,minio,keycloak,localhost,127.0.0.1,::1}

services:
  postgresql:
    image: pgvector/pgvector:pg16
    environment:
      <<: *substrate-internal-proxy-env
      POSTGRES_DB: ${SUBSTRATE_POSTGRES_DATABASE:-agentsmith}
      POSTGRES_USER: ${SUBSTRATE_POSTGRES_USER:-agentsmith}
      POSTGRES_PASSWORD: ${SUBSTRATE_POSTGRES_PASSWORD:?SUBSTRATE_POSTGRES_PASSWORD must be set}
    ports:
      - "${SUBSTRATE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7
    environment:
      <<: *substrate-internal-proxy-env
      MONGO_INITDB_ROOT_USERNAME: ${SUBSTRATE_MONGODB_USER:-agentsmith}
      MONGO_INITDB_ROOT_PASSWORD: ${SUBSTRATE_MONGODB_PASSWORD:?SUBSTRATE_MONGODB_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${SUBSTRATE_MONGODB_DATABASE:-agentsmith}
    ports:
      - "${SUBSTRATE_MONGODB_PORT:-27027}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    environment:
      <<: *substrate-internal-proxy-env
      SUBSTRATE_REDIS_PASSWORD: ${SUBSTRATE_REDIS_PASSWORD:?SUBSTRATE_REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${SUBSTRATE_REDIS_PASSWORD:?SUBSTRATE_REDIS_PASSWORD must be set}
    ports:
      - "${SUBSTRATE_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${SUBSTRATE_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      <<: *substrate-internal-proxy-env
      MINIO_ROOT_USER: ${SUBSTRATE_MINIO_ACCESS_KEY:-agentsmith}
      MINIO_ROOT_PASSWORD: ${SUBSTRATE_MINIO_SECRET_KEY:?SUBSTRATE_MINIO_SECRET_KEY must be set}
    ports:
      - "${SUBSTRATE_MINIO_PORT:-19000}:9000"
      - "${SUBSTRATE_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      <<: *substrate-internal-proxy-env
      SUBSTRATE_MINIO_ACCESS_KEY: ${SUBSTRATE_MINIO_ACCESS_KEY:-agentsmith}
      SUBSTRATE_MINIO_SECRET_KEY: ${SUBSTRATE_MINIO_SECRET_KEY:?SUBSTRATE_MINIO_SECRET_KEY must be set}
      SUBSTRATE_MINIO_BUCKET: ${SUBSTRATE_MINIO_BUCKET:-agentsmith-files}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        until mc alias set agentsmith http://minio:9000 "$$SUBSTRATE_MINIO_ACCESS_KEY" "$$SUBSTRATE_MINIO_SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing "agentsmith/$$SUBSTRATE_MINIO_BUCKET"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command:
      - start-dev
      - --http-port=8080
    environment:
      <<: *substrate-internal-proxy-env
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SUBSTRATE_KEYCLOAK_ADMIN:?SUBSTRATE_KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SUBSTRATE_KEYCLOAK_ADMIN_PASSWORD:?SUBSTRATE_KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${SUBSTRATE_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master --user "$${KC_BOOTSTRAP_ADMIN_USERNAME}" --password "$${KC_BOOTSTRAP_ADMIN_PASSWORD}" >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  postgresql-data:
  mongodb-data:
  redis-data:
  minio-data:
  keycloak-data:
