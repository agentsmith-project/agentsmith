  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Operations
      operationId: listAlertRules
      summary: List alert rules
      description: >
        Returns all alert rules for the project. Rules can be filtered by
        enabled status,

        severity, and alert type.
      parameters:
        - name: enabled
          in: query
          description: Filter by enabled status
          required: false
          schema:
            type: boolean
        - name: severity
          in: query
          description: Filter by severity level
          required: false
          schema:
            type: string
            enum:
              - info
              - warning
              - error
              - critical
        - name: type
          in: query
          description: Filter by alert type
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Alert rules list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
    post:
      tags:
        - Operations
      operationId: createAlertRule
      summary: Create alert rule
      description: >
        Creates a new alert rule for the project. The rule defines trigger
        conditions,

        notification channels, and behavior settings.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleCreateRequest"
      responses:
        "201":
          description: Alert rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401": *a1
        "403": *a2
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: ruleId
        in: path
        required: true
        description: Alert rule ID
        schema:
          type: string
    get:
      tags:
        - Operations
      operationId: getAlertRule
      summary: Get alert rule
      description: Returns a single alert rule by ID
      responses:
        "200":
          description: Alert rule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
        "404": *a3
    put:
      tags:
        - Operations
      operationId: updateAlertRule
      summary: Update alert rule
      description: >
        Updates an existing alert rule. Only provide fields that should be
        changed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdateRequest"
      responses:
        "200":
          description: Alert rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401": *a1
        "403": *a2
        "404": *a3
    delete:
      tags:
        - Operations
      operationId: deleteAlertRule
      summary: Delete alert rule
      description: Permanently deletes an alert rule
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Alert rule deleted
        "401": *a1
        "403": *a2
        "404": *a3
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules/{ruleId}/test:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: ruleId
        in: path
        required: true
        description: Alert rule ID
        schema:
          type: string
    post:
      tags:
        - Operations
      operationId: testAlertRule
      summary: Test alert rule
      description: >
        Evaluates the alert rule against current data to check if it would
        trigger.

        Returns the test result without actually sending any notifications.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleTestResponse"
        "401": *a1
        "403": *a2
        "404": *a3
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-notifications:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Operations
      operationId: listAlertNotifications
      summary: List alert notifications
      description: |
        Returns alert notifications (triggered alert instances) for the project.
        Supports filtering by status, time range, and rule.
      parameters:
        - name: status
          in: query
          description: Filter by notification status
          required: false
          schema:
            type: string
            enum:
              - firing
              - resolved
              - silenced
        - name: rule_id
          in: query
          description: Filter by alert rule
          required: false
          schema:
            type: string
        - name: start_time
          in: query
          description: Start time in ISO 8601 format
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: End time in ISO 8601 format
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Items per page
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Alert notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertNotificationsListResponse"
        "401": *a1
        "403": *a2
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: notificationId
        in: path
        required: true
        description: Alert notification ID
        schema:
          type: string
    put:
      tags:
        - Operations
      operationId: updateAlertNotification
      summary: Update alert notification status
      description: >
        Updates the status of an alert notification (e.g., mark as resolved or
        silenced).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SilenceNotificationRequest"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertNotification"
        "401": *a1
        "403": *a2
        "404": *a3
components:
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    streamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string
    agentRunnerId:
      name: agentRunnerId
      in: path
      required: true
      schema:
        type: string
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    endpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
    libraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
    taskFileTemplateId:
      name: taskFileTemplateId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: UNAUTHORIZED
            message: Missing or invalid authorization token
    Forbidden:
      description: Forbidden - Valid token but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: PERMISSION_DENIED
            message: You do not have permission to perform this action
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: RESOURCE_NOT_FOUND
            message: The requested resource does not exist
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: VALIDATION_ERROR
            message: Invalid request parameters
    Conflict:
      description: Conflict - Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: RESOURCE_ALREADY_EXISTS
            message: A resource with this identifier already exists
    RateLimited:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: RATE_LIMIT_EXCEEDED
            message: Rate limit exceeded. Please retry after a few seconds
    LimitExceeded:
      description: Limit Exceeded - Resource limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: SPENDING_LIMIT_EXCEEDED
            message: Resource limit exceeded
    InternalError:
      description: Internal Server Error - Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: INTERNAL_ERROR
            message: An unexpected error occurred. Please try again later
  schemas:
    Workspace:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    MemberGroupSummary:
      type: object
      required:
        - id
        - name
        - permission_template_id
      properties:
        id:
          type: string
        name:
          type: string
        permission_template_id:
          type: string
        built_in:
          type: boolean
        system_key:
          type: string
    ProjectMembershipStatus:
      type: string
      enum:
        - active
        - pending
        - suspended
        - none
    Project:
      type: object
      required:
        - id
        - workspace_id
        - name
        - visibility
        - owner_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
        join_policy:
          type: string
          enum:
            - approval_required
            - open
        owner_id:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
            - deleted
        governance_json:
          type: object
          additionalProperties: true
        limits_json:
          type: object
          additionalProperties: true
        admin_member_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
        updated_at:
          type: string
    ProjectWithMembership:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required:
            - permissions
            - membership_status
          properties:
            groups:
              type: array
              items:
                $ref: "#/components/schemas/MemberGroupSummary"
            permissions:
              type: array
              items:
                type: string
            membership_status:
              $ref: "#/components/schemas/ProjectMembershipStatus"
    ProjectListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWithMembership"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
        join_policy:
          type: string
          enum:
            - approval_required
            - open
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
        join_policy:
          type: string
          enum:
            - approval_required
            - open
        status:
          type: string
          enum:
            - active
            - archived
            - deleted
        governance_json:
          type: object
          additionalProperties: true
        limits_json:
          type: object
          additionalProperties: true
    ChatSession:
      type: object
      required:
        - id
        - title
        - model
      properties:
        id:
          type: string
        title:
          type: string
        model:
          type: string
        endpoint_id:
          type: string
        execution_status:
          type: string
          enum:
            - running
            - stopping
            - terminating
            - completed
            - stopped
            - failed
        termination_state:
          type: string
          nullable: true
          enum:
            - terminating
        stop_mode:
          $ref: "#/components/schemas/StopMode"
        can_escalate:
          type: boolean
        escalation_reason:
          type: string
          nullable: true
          enum:
            - STOP_ESCALATION_UNAVAILABLE
    StopMode:
      type: string
      enum:
        - cancel
        - terminate
    TaskRunState:
      type: string
      enum:
        - running
        - cancelling
        - terminating
        - finalizing
        - idle
    TaskAgentPresence:
      type: string
      enum:
        - online
        - offline
        - managed
        - unknown
    TaskRunSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - runner_id
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - stopping
            - succeeded
            - failed
            - canceled
        runner_id:
          type: string
          description: Resolved agent runner id used for this run.
        source:
          type: string
          enum:
            - runner_test
          description: Present when this run belongs to a dedicated Developer runner test task.
        runner_test:
          type: boolean
          enum:
            - true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    TaskInputRef:
      type: object
      additionalProperties: true
      required:
        - id
        - kind
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - library_object
            - artifact
            - url
    TaskInputRefInput:
      type: object
      additionalProperties: true
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - library_object
            - artifact
            - url
    TaskStats:
      type: object
      additionalProperties: true
      properties:
        user_turn_count:
          type: integer
          minimum: 0
        message_count:
          type: integer
          minimum: 0
        artifact_count:
          type: integer
          minimum: 0
        attached_input_count:
          type: integer
          minimum: 0
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
        prompt:
          type: string
          description: Initial user prompt.
        bound_runner_id:
          type: string
          minLength: 1
        input_refs:
          type: array
          items:
            $ref: "#/components/schemas/TaskInputRefInput"
        workspace_mode:
          type: string
          enum:
            - create_new
            - use_existing
            - use_template
        workspace_name:
          type: string
        workspace_file_library_id:
          type: string
        task_file_template_id:
          type: string
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
    TaskRunnerBindingKind:
      type: string
      enum:
        - managed
        - developer
    TaskRunnerBindingSource:
      type: string
      enum:
        - default_managed
        - explicit
    TaskRunnerBindingReasonCode:
      type: string
      enum:
        - agent_runner_unavailable
        - agent_runner_model_unconfigured
        - agent_runner_capability_mismatch
        - agent_runner_default_conflict
        - permission_denied
        - agent_runner_disconnected
        - agent_runner_stale
    TaskRunnerBindingSummary:
      type: object
      additionalProperties: false
      required:
        - state
        - summary
      properties:
        state:
          type: string
        summary:
          type: string
          description: Display-safe status key or short summary. It never contains raw diagnostics or provider configuration.
        reason_code:
          $ref: "#/components/schemas/TaskRunnerBindingReasonCode"
    TaskRunnerBindingAction:
      type: object
      additionalProperties: false
      required:
        - operation
        - visible
        - allowed
        - required_permissions
        - danger_level
      properties:
        operation:
          type: string
          enum:
            - bind_to_task
        visible:
          type: boolean
        allowed:
          type: boolean
        reason_code:
          $ref: "#/components/schemas/TaskRunnerBindingReasonCode"
        required_permissions:
          type: array
          items:
            type: string
        danger_level:
          type: string
          enum:
            - none
    TaskRunnerBindingOption:
      type: object
      additionalProperties: false
      required:
        - option_id
        - label
        - bound_runner_kind
        - runner_binding_source
        - readiness
        - capability
        - actions
      properties:
        option_id:
          type: string
        label:
          type: string
        bound_runner_kind:
          $ref: "#/components/schemas/TaskRunnerBindingKind"
        runner_binding_source:
          $ref: "#/components/schemas/TaskRunnerBindingSource"
        agent_runner_id:
          type: string
        readiness:
          $ref: "#/components/schemas/TaskRunnerBindingSummary"
        capability:
          $ref: "#/components/schemas/TaskRunnerBindingSummary"
        freshness:
          $ref: "#/components/schemas/TaskRunnerBindingSummary"
        disabled_reason_code:
          $ref: "#/components/schemas/TaskRunnerBindingReasonCode"
        actions:
          type: object
          additionalProperties: false
          required:
            - bind_to_task
          properties:
            bind_to_task:
              $ref: "#/components/schemas/TaskRunnerBindingAction"
    TaskRunnerBindingOptionsResponse:
      type: object
      additionalProperties: false
      required:
        - options
        - generated_at
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/TaskRunnerBindingOption"
        generated_at:
          type: string
          format: date-time
    StartTaskRunRequest:
      type: object
      additionalProperties: false
      required:
        - intent
      properties:
        intent:
          type: string
          minLength: 1
          description: User intent for this Agent Task run.
        input_refs:
          type: array
          items:
            $ref: "#/components/schemas/TaskInputRefInput"
    TaskActivityItem:
      type: object
      additionalProperties: false
      required:
        - id
        - task_id
        - kind
        - actor
        - content
        - created_at
      properties:
        id:
          type: string
        task_id:
          type: string
        kind:
          type: string
          enum:
            - user_intent
            - runner_output
        actor:
          type: string
          enum:
            - user
            - runner
        content:
          type: string
        created_at:
          type: string
