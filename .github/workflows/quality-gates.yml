name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_l2:
        description: "Run mock functional lane"
        required: false
        default: true
        type: boolean
      run_l3:
        description: "Run core real lane (requires REAL_LANE_API_KEY secret)"
        required: false
        default: false
        type: boolean
      run_visual:
        description: "Run manual visual lane (non-blocking baseline workflow)"
        required: false
        default: false
        type: boolean

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-fast:
    name: gate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gate-fast
        run: make gate-fast

  lane-mock:
    name: lane-mock
    needs: gate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run lane-mock
        run: make lane-mock

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-mock-smoke-artifacts
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**

  lane-visual:
    name: lane-visual
    needs: lane-mock
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_l2) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run lane-visual
        run: make lane-visual

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-visual-artifacts
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**

  visual-manual:
    name: visual-manual
    needs: lane-mock
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run visual lane (manual, non-blocking)
        run: make lane-visual

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-manual-artifacts
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**

  lane-real-core:
    name: lane-real-core
    needs: gate-fast
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_l3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REAL_LANE_API_KEY: ${{ secrets.REAL_LANE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [[ -z "${REAL_LANE_API_KEY:-}" ]]; then
            echo "REAL_LANE_API_KEY secret is required for the L3 real lane." >&2
            exit 1
          fi

      - name: Prepare integration dependencies
        run: |
          set -euo pipefail
          make bootstrap

      - name: Run lane-real-core
        run: |
          set -euo pipefail
          make lane-real-core

      - name: Upload L3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-real-lane-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/real-lane/current/**
            test-results/**
            playwright-report/**
