name: Engineering Gate

on:
  workflow_dispatch:
    inputs:
      report_name:
        description: "Custom governance report name (optional)"
        required: false
        default: ""
        type: string
  schedule:
    # Daily UTC off-peak run for backend-real engineering regression.
    - cron: "30 2 * * *"

concurrency:
  group: engineering-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Remove the BACKEND_REAL_API_KEY fallback after PRESET_ENDPOINT_API_KEY is configured
      # and one scheduled Engineering Gate and one manual Quality Gates backend-real core run pass.
      PRESET_ENDPOINT_API_KEY: ${{ secrets.PRESET_ENDPOINT_API_KEY || secrets.BACKEND_REAL_API_KEY }}
      REPORT_NAME: ${{ inputs.report_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [[ -z "${PRESET_ENDPOINT_API_KEY:-}" ]]; then
            echo "PRESET_ENDPOINT_API_KEY secret is required for the engineering gate backend-real run; BACKEND_REAL_API_KEY is accepted only as a temporary GitHub Actions secret rename fallback." >&2
            exit 1
          fi

      - name: Materialize backend-real endpoint env
        run: |
          set -euo pipefail
          umask 077
          printf 'PRESET_ENDPOINT_API_KEY=%s\n' "${PRESET_ENDPOINT_API_KEY}" > .env.backend-real

      - name: Prepare backend-real dependencies
        run: |
          set -euo pipefail
          npm run backend-real:bootstrap

      - name: Run backend-real core lane
        run: |
          set -euo pipefail
          npm run lane:backend-real:core

      - name: Generate governance report (archived)
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${REPORT_NAME:-}" ]]; then
            make governance-report REPORT_NAME="${REPORT_NAME}" REPORT_ARCHIVE=1 REPORT_CHECKS=typecheck,openapi-check,contracts-check
          else
            make governance-report REPORT_ARCHIVE=1 REPORT_CHECKS=typecheck,openapi-check,contracts-check
          fi

      - name: Prune backend-real runtime caches before artifact upload
        if: always()
        run: |
          set -euo pipefail
          if [[ -d artifacts/backend-real ]]; then
            sudo find artifacts/backend-real -type d -name afscp-juicefs-cache -prune -exec rm -rf -- {} +
          fi

      - name: Upload engineering artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineering-gate-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/governance-reports/**
            artifacts/backend-real/current/**
            artifacts/backend-real/runs/**
            !artifacts/backend-real/**/afscp-juicefs-cache/**
            !artifacts/backend-real/runs/**/next-dist/**
            artifacts/mock-lane/runs/**
            !artifacts/mock-lane/runs/**/next-dist/**
            test-results/**
            playwright-report/**
