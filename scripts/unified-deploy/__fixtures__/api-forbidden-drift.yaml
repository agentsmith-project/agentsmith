apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentsmith-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/agentsmith-api:test
          env:
            - name: API_REPLICAS
              value: "2"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentsmith-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentsmith-api
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: execution-gateway
spec:
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: execution-gateway
                port:
                  number: 8080
