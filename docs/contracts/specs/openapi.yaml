  /api/v1/workspaces/{workspaceId}/projects/{projectId}/authorize:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    post:
      tags:
        - Authorization
      operationId: checkAuthorization
      summary: Unified authorization decision endpoint
      description: |
        Checks if a subject is authorized to perform an action on a resource.
        This endpoint unifies permission checks, resource policy evaluation, and
        project default settings into a single decision point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRequest"
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
        "401": *a1
        "403": *a2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/quota/check:
    parameters:
