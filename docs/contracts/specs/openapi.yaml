        - Governance
      operationId: exportAuditEvents
      summary: Export audit events
      description: |
        Exports audit events in CSV or JSON format. Supports filtering by
        time range, action, actor type, and other criteria.
      parameters:
        - name: start_time
          in: query
          required: true
          description: Start time in ISO 8601 format
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          description: End time in ISO 8601 format
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [csv, json]
            default: json
        - name: action
          in: query
          description: Filter by action type
          schema:
            type: string
        - name: actor_type
          in: query
          description: Filter by actor type
          schema:
            type: string
            enum: [user, agent, plugin]
        - name: result
          in: query
          description: Filter by result
          schema:
            type: string
            enum: [ok, error]
      responses:
        "200":
          description: Audit export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportResponse"
            text/csv:
              schema:
                type: string
                format: binary
        "401": *a1
        "403": *a2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sse-ticket:
