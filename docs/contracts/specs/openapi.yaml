        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/{libraryId}/objects/move:
    post:
      tags:
      - Sources
      operationId: post_sourceLibraryObjectsMove
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/{libraryId}/objects/meta:
    post:
      tags:
      - Sources
      operationId: post_sourceLibraryObjectsMeta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
