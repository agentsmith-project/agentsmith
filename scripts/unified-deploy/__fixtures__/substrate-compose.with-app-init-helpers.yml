services:
  postgresql:
    image: postgres:16-alpine
  mongodb:
    image: mongo:7
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SUBSTRATE_REDIS_PASSWORD}"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
  api-init:
    image: ghcr.io/mbos/agentsmith-api:dev
  init-web:
    image: ghcr.io/mbos/agentsmith-web:dev
  llmup-init:
    image: ghcr.io/mbos/llmup:dev
  universal-proxy-init:
    image: ghcr.io/mbos/universal-proxy:dev
