openapi: 3.1.0
info:
  title: MBOS API
  version: 1.0.0
  description: Authoritative HTTP API contract for MBOS private-node deployment.
servers:
- url: /
  description: same-origin
tags:
- name: System
- name: Workspaces
- name: Projects
- name: Chat
- name: Agents
- name: Endpoints
- name: Sources
- name: Contracts
- name: Credentials
- name: Notebook
  description: Notebook tasks and execution trace APIs
paths:
  /api/v1/openapi.json:
    get:
      tags:
      - Contracts
      operationId: getOpenApiSpec
      summary: Get OpenAPI spec
      responses:
        '200':
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/asyncapi.json:
    get:
      tags:
      - Contracts
      operationId: getAsyncApiSpec
      summary: Get AsyncAPI spec
      responses:
        '200':
          description: AsyncAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/workspaces:
    get:
      tags:
      - Workspaces
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceId}/projects:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    get:
      tags:
      - Projects
      operationId: listProjects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Projects
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    get:
      tags:
      - Chat
      operationId: listChatSessions
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Chat
      operationId: createChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    patch:
      tags:
      - Chat
      operationId: updateChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatSessionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Chat
      operationId: deleteChatSession
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/messages:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    post:
      tags:
      - Chat
      operationId: createChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/messages/stream:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    post:
      tags:
      - Chat
      operationId: streamChatMessage
      summary: Create message and stream assistant response via SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatMessageRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/attachments:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    post:
      tags:
      - Chat
      operationId: uploadChatAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/streams/{streamId}:stop:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    - $ref: '#/components/parameters/streamId'
    post:
      tags:
      - Chat
      operationId: stopChatStreamByStreamId
      responses:
        '202':
          description: Stop accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/stop:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/sessionId'
    post:
      tags:
      - Chat
      operationId: stopChatStreamBySession
      responses:
        '202':
          description: Stop accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agents:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    get:
      tags:
      - Agents
      operationId: listAgents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      tags:
      - Agents
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agents/{agentId}:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/agentId'
    get:
      tags:
      - Agents
      operationId: getAgent
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    patch:
      tags:
      - Agents
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    delete:
      tags:
      - Agents
      operationId: deleteAgent
      responses:
        '204':
          description: Deleted
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agents/{agentId}/connection-info:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/agentId'
    get:
      tags:
      - Agents
      operationId: getAgentConnectionInfo
      responses:
        '200':
          description: Connection info
          content:
            application/json:
              schema:
                type: object
                required:
                - ws_url
                properties:
                  ws_url:
                    type: string
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agents/{agentId}/keys:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/agentId'
    get:
      tags:
      - Agents
      operationId: listAgentKeys
      responses:
        '200':
          description: Key list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentKey'
    post:
      tags:
      - Agents
      operationId: createAgentKey
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentKeyResponse'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agents/{agentId}/keys/{keyId}:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/agentId'
    - $ref: '#/components/parameters/keyId'
    delete:
      tags:
      - Agents
      operationId: deleteAgentKey
      responses:
        '204':
          description: Deleted
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/endpoints:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    get:
      tags:
      - Endpoints
      operationId: listEndpoints
      responses:
        '200':
          description: Endpoint list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Endpoint'
    post:
      tags:
      - Endpoints
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '201':
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/endpoints/{endpointId}:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/endpointId'
    get:
      tags:
      - Endpoints
      operationId: getEndpoint
      responses:
        '200':
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
    put:
      tags:
      - Endpoints
      operationId: updateEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
    delete:
      tags:
      - Endpoints
      operationId: deleteEndpoint
      responses:
        '204':
          description: Deleted
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    get:
      tags:
      - Sources
      operationId: listSourceLibraries
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileLibrary'
    post:
      tags:
      - Sources
      operationId: createFileLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileLibraryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileLibrary'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/default-personal:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    get:
      tags:
      - Sources
      operationId: ensureDefaultPersonalFileLibrary
      responses:
        '200':
          description: Ensured default personal library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileLibrary'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/{libraryId}/objects:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/libraryId'
    get:
      tags:
      - Sources
      operationId: listLibraryObjects
      responses:
        '200':
          description: Object list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceObject'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/{libraryId}/objects/upload:
    parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/projectId'
    - $ref: '#/components/parameters/libraryId'
    post:
      tags:
      - Sources
      operationId: uploadLibraryObject
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                key:
                  type: string
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceObject'
  /api/v1/workspaces/{workspaceId}:
    get:
      tags:
      - Workspaces
      operationId: get_workspaceItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - task_id
                  - type
                  - created_at
                  properties:
                    id:
                      type: string
                    task_id:
                      type: string
                    type:
                      type: string
                      enum:
                      - text
                      - image
                      - file
                      - other
                    task_relative_path:
                      type: string
                      description: Relative path inside the notebook task working directory for runtime-originated artifacts.
                    title:
                      type: string
                    content:
                      type: string
                    thumbnail_url:
                      type: string
                    file_size:
                      type: integer
                      minimum: 0
                    mime_type:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags:
      - Workspaces
      operationId: get_workspaceMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}:
    get:
      tags:
      - Projects
      operationId: get_item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/sources:
