name: Contracts Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AGENTS symlink contract
        run: |
          set -euo pipefail
          test -L AGENTS.md
          target="$(readlink AGENTS.md)"
          if [[ "${target}" != "CLAUDE.md" ]]; then
            echo "AGENTS.md must symlink to CLAUDE.md, got: ${target}" >&2
            exit 1
          fi

      - name: Verify default release model baseline (glm-5)
        run: |
          set -euo pipefail
          grep -q 'GLM_MODEL="${GLM_MODEL:-glm-5}"' scripts/notebook-agent-demo-up.sh
          grep -q 'GLM_MODEL="${GLM_MODEL:-glm-5}"' scripts/notebook-agent-init-resources.sh
          grep -q '"model":"glm-5"' scripts/notebook-agent-demo-check.sh
          grep -q '"model":"glm-5"' scripts/notebook-agent-engineering-smoke.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gate-fast
        run: make gate-fast

      - name: Run permission contract drift check
        run: npm run contracts:check

      - name: Run engineering baseline sync check
        run: npm run contracts:check-engineering-sync
