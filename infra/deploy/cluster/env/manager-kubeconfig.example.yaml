# Copy the real sandbox-manager runtime kubeconfig to:
#   .infra/cluster-deploy/manager-kubeconfig
# and on the target host to:
#   $HOME/agentsmith/cluster-deploy/config/manager-kubeconfig
#
# This kubeconfig is distinct from the deploy kubeconfig.
# It should be limited to:
# - namespaced access in `mbos`
# - the smallest cluster-scope `PersistentVolume` access needed by sandbox-manager
apiVersion: v1
kind: Config
clusters: []
contexts: []
current-context: ""
preferences: {}
users: []
