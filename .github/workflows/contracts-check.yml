name: Contracts Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run permission contract drift check
        run: npm run contracts:check

      - name: Run release baseline sync check
        run: npm run contracts:check-release-sync

      - name: Run OpenAPI governance checks
        run: npm run contracts:check-openapi

      - name: Verify OpenAPI generated types are in sync
        run: npm run openapi:check-generated
