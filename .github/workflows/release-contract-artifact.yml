name: Release Contract Artifact

on:
  workflow_dispatch:
    inputs:
      release_contract_input_run_id:
        description: "GitHub Actions run ID that uploaded the release contract input artifact"
        required: true
        type: string
      release_contract_input_artifact_name:
        description: "GitHub Actions artifact name containing release-contract-input.json"
        required: true
        type: string
        default: "agentsmith-release-contract-input"

concurrency:
  group: release-contract-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  generate-release-contract:
    name: generate-release-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runner contract workspace package
        run: npm run build -w @mbos/agent-runner-contract

      - name: Gate runner release manifest source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNNER_RELEASE_MANIFEST_PATH="scripts/governance/__fixtures__/release-boundary/runner-release-manifest.valid.json"
          runner_repo="agentsmith-project/agentsmith-runner"
          runner_gate_dir="artifacts/release-contract/runner-manifest-source-gate"
          runner_remote_download_dir="${runner_gate_dir}/artifact-download"
          mkdir -p "${runner_gate_dir}"
          rm -rf "${runner_remote_download_dir}"

          npm run contracts:check-runner-image-lock -- --adoption --manifest "${RUNNER_RELEASE_MANIFEST_PATH}"

          runner_run_id="$(node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(manifest.artifact_provenance.run_id || ''));" "${RUNNER_RELEASE_MANIFEST_PATH}")"
          runner_artifact_name="$(node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(manifest.artifact_provenance.subject_name || ''));" "${RUNNER_RELEASE_MANIFEST_PATH}")"
          if [[ ! "${runner_run_id}" =~ ^[0-9]+$ ]]; then
            echo "runner release manifest artifact_provenance.run_id must be a GitHub Actions numeric run id." >&2
            exit 1
          fi
          if [[ -z "${runner_artifact_name}" ]]; then
            echo "runner release manifest artifact_provenance.subject_name is required." >&2
            exit 1
          fi

          gh run view "${runner_run_id}" \
            --repo "${runner_repo}" \
            --json conclusion,databaseId,headSha,status,url,workflowName \
            > "${runner_gate_dir}/run-view.json"
          gh api "repos/${runner_repo}/actions/runs/${runner_run_id}" \
            > "${runner_gate_dir}/run-api.json"
          gh api "repos/${runner_repo}/actions/runs/${runner_run_id}/artifacts?per_page=100" \
            > "${runner_gate_dir}/artifacts-api.json"
          gh run download "${runner_run_id}" \
            --repo "${runner_repo}" \
            --name "${runner_artifact_name}" \
            --dir "${runner_remote_download_dir}"

          export RUNNER_REMOTE_MANIFEST_DOWNLOAD_DIR="${runner_remote_download_dir}"
          export RUNNER_REMOTE_MANIFEST_GATE_DIR="${runner_gate_dir}"
          node <<'NODE'
          const { readdirSync, readFileSync, statSync, writeFileSync } = require('node:fs');
          const path = require('node:path');

          const downloadDir = process.env.RUNNER_REMOTE_MANIFEST_DOWNLOAD_DIR;
          const gateDir = process.env.RUNNER_REMOTE_MANIFEST_GATE_DIR;
          const manifestSchemaVersion = 'agentsmith.runner-release-manifest/v1';
          const fail = (message) => {
            throw new Error(`runner release manifest artifact download failed: ${message}`);
          };
          if (!downloadDir || !gateDir) {
            fail('download and gate directories are required.');
          }

          const files = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir)) {
              const filePath = path.join(dir, entry);
              if (statSync(filePath).isDirectory()) {
                walk(filePath);
              } else {
                files.push(filePath);
              }
            }
          };
          walk(downloadDir);

          const matches = [];
          for (const filePath of files.filter((candidate) => candidate.endsWith('.json'))) {
            try {
              const json = JSON.parse(readFileSync(filePath, 'utf8'));
              if (
                json
                && typeof json === 'object'
                && !Array.isArray(json)
                && json.schema_version === manifestSchemaVersion
                && json.artifact_provenance?.subject_name === 'runner-release-manifest'
              ) {
                matches.push(path.resolve(filePath));
              }
            } catch {
              // Non-manifest JSON files are ignored; uniqueness is enforced on parsed manifest candidates.
            }
          }

          if (matches.length !== 1) {
            fail(`expected exactly one runner release manifest JSON; found ${matches.length}.`);
          }
          writeFileSync(path.join(gateDir, 'remote-manifest-path.txt'), `${matches[0]}\n`);
          NODE

      - name: Gate ASBCP final manifest source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asbcp_lock_path="infra/deploy/shared/asbcp-image.lock"
          asbcp_repo="agentsmith-project/agentsmith-sandbox-control-plane"
          asbcp_asset_name="asbcp-final-manifest.json"
          asbcp_gate_dir="artifacts/release-contract/asbcp-final-manifest-source-gate"
          asbcp_manifest_path="${asbcp_gate_dir}/${asbcp_asset_name}"
          mkdir -p "${asbcp_gate_dir}"
          rm -f "${asbcp_manifest_path}"

          npm run contracts:check-asbcp-image-only

          export ASBCP_IMAGE_LOCK_PATH="${asbcp_lock_path}"
          export ASBCP_RELEASE_TAG_PATH="${asbcp_gate_dir}/release-tag.txt"
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const lockPath = process.env.ASBCP_IMAGE_LOCK_PATH;
          const releaseTagPath = process.env.ASBCP_RELEASE_TAG_PATH;
          const releaseUrlPrefix = 'https://github.com/agentsmith-project/agentsmith-sandbox-control-plane/releases/tag/';
          const fail = (message) => {
            throw new Error(`ASBCP final manifest source gate failed: ${message}`);
          };
          if (!lockPath || !releaseTagPath) {
            fail('lock path and release tag output path are required.');
          }

          const values = new Map();
          readFileSync(lockPath, 'utf8').split(/\r?\n/u).forEach((rawLine, index) => {
            const line = rawLine.trim();
            if (line.length === 0 || line.startsWith('#')) {
              return;
            }
            const separatorIndex = line.indexOf('=');
            if (separatorIndex <= 0) {
              fail(`${lockPath}:${index + 1} must be key=value.`);
            }
            values.set(line.slice(0, separatorIndex).trim(), line.slice(separatorIndex + 1).trim());
          });

          const version = values.get('asbcp_version') || '';
          const releaseUrl = values.get('asbcp_release_url') || '';
          if (!/^v\d+\.\d+\.\d+(?:[.-][0-9A-Za-z]+)*$/u.test(version)) {
            fail(`asbcp_version must be a release tag; actual ${version || '<missing>'}.`);
          }
          if (releaseUrl !== `${releaseUrlPrefix}${version}`) {
            fail(`asbcp_release_url must match asbcp_version; expected ${releaseUrlPrefix}${version}; actual ${releaseUrl || '<missing>'}.`);
          }

          writeFileSync(releaseTagPath, `${version}\n`);
          NODE

          asbcp_release_tag="$(cat "${ASBCP_RELEASE_TAG_PATH}")"
          export ASBCP_RELEASE_TAG="${asbcp_release_tag}"
          export ASBCP_RELEASE_API_PATH="${asbcp_gate_dir}/release-api.json"
          export ASBCP_ASSET_API_PATH="${asbcp_gate_dir}/asset-api.json"
          export ASBCP_ASSET_ID_PATH="${asbcp_gate_dir}/asset-id.txt"
          export ASBCP_ASSET_NAME="${asbcp_asset_name}"
          gh api "repos/${asbcp_repo}/releases/tags/${asbcp_release_tag}" \
            > "${ASBCP_RELEASE_API_PATH}"

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const releaseApiPath = process.env.ASBCP_RELEASE_API_PATH;
          const assetApiPath = process.env.ASBCP_ASSET_API_PATH;
          const assetIdPath = process.env.ASBCP_ASSET_ID_PATH;
          const expectedAssetName = process.env.ASBCP_ASSET_NAME;
          const expectedTag = process.env.ASBCP_RELEASE_TAG;
          const fail = (message) => {
            throw new Error(`ASBCP final manifest source gate failed: ${message}`);
          };
          const isRecord = (value) => value && typeof value === 'object' && !Array.isArray(value);
          if (!releaseApiPath || !assetApiPath || !assetIdPath || !expectedAssetName || !expectedTag) {
            fail('release API path, asset API path, asset ID path, asset name, and release tag are required.');
          }

          const release = JSON.parse(readFileSync(releaseApiPath, 'utf8'));
          if (!isRecord(release)) {
            fail('GitHub release metadata must be a JSON object.');
          }
          if (release.tag_name !== expectedTag) {
            fail(`release tag must be ${expectedTag}; actual ${release.tag_name || '<missing>'}.`);
          }
          const assets = Array.isArray(release.assets) ? release.assets.filter(isRecord) : [];
          const matchingAssets = assets.filter((asset) => asset.name === expectedAssetName);
          if (matchingAssets.length !== 1) {
            fail(`expected exactly one ${expectedAssetName} release asset; found ${matchingAssets.length}.`);
          }
          const asset = matchingAssets[0];
          if (!Number.isSafeInteger(asset.id) || asset.id <= 0) {
            fail(`${expectedAssetName} asset id must be a positive integer.`);
          }
          writeFileSync(assetApiPath, `${JSON.stringify(asset, null, 2)}\n`);
          writeFileSync(assetIdPath, `${asset.id}\n`);
          NODE

          asbcp_asset_id="$(cat "${ASBCP_ASSET_ID_PATH}")"
          export ASBCP_FINAL_MANIFEST_PATH="${asbcp_manifest_path}"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${asbcp_repo}/releases/assets/${asbcp_asset_id}" \
            > "${ASBCP_FINAL_MANIFEST_PATH}"

          export ASBCP_FINAL_MANIFEST_DOWNLOAD_SHA256="sha256:$(sha256sum "${ASBCP_FINAL_MANIFEST_PATH}" | awk '{print $1}')"
          printf '%s\n' "${ASBCP_FINAL_MANIFEST_DOWNLOAD_SHA256}" > "${asbcp_gate_dir}/download-sha256.txt"
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const assetApiPath = process.env.ASBCP_ASSET_API_PATH;
          const downloadedSha256 = process.env.ASBCP_FINAL_MANIFEST_DOWNLOAD_SHA256;
          const fail = (message) => {
            throw new Error(`ASBCP final manifest source gate failed: ${message}`);
          };
          if (!assetApiPath || !downloadedSha256) {
            fail('asset API path and downloaded SHA256 are required.');
          }
          const asset = JSON.parse(readFileSync(assetApiPath, 'utf8'));
          const apiDigest = typeof asset.digest === 'string' ? asset.digest.trim().toLowerCase() : '';
          if (apiDigest.length === 0) {
            process.exit(0);
          }
          if (!/^sha256:[0-9a-f]{64}$/u.test(apiDigest)) {
            fail(`release asset digest must be sha256:<64 lowercase hex>; actual ${asset.digest}.`);
          }
          if (apiDigest !== downloadedSha256) {
            fail(`release asset digest must match downloaded manifest sha256; expected ${apiDigest}; actual ${downloadedSha256}.`);
          }
          NODE

          npm run contracts:check-asbcp-adoption -- --manifest "${ASBCP_FINAL_MANIFEST_PATH}"

      - name: Gate release contract input source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTRACT_INPUT_ARTIFACT_NAME: ${{ inputs.release_contract_input_artifact_name }}
          RELEASE_CONTRACT_INPUT_RUN_ID: ${{ inputs.release_contract_input_run_id }}
          RELEASE_CONTRACT_CURRENT_SHA: ${{ github.sha }}
          RELEASE_CONTRACT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          canonical_artifact_name="agentsmith-release-contract-input"
          canonical_workflow_name="Image Publish"
          canonical_workflow_path=".github/workflows/image-publish.yml"
          canonical_job_name="publish-images"
          gate_dir="artifacts/release-contract/source-gate"
          export RELEASE_CONTRACT_INPUT_SOURCE_ARTIFACT_NAME="${canonical_artifact_name}"
          export RELEASE_CONTRACT_INPUT_SOURCE_WORKFLOW_NAME="${canonical_workflow_name}"
          export RELEASE_CONTRACT_INPUT_SOURCE_WORKFLOW_PATH="${canonical_workflow_path}"
          export RELEASE_CONTRACT_INPUT_SOURCE_JOB_NAME="${canonical_job_name}"

          if [[ ! "${RELEASE_CONTRACT_INPUT_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "release_contract_input_run_id must be a GitHub Actions numeric run id." >&2
            exit 1
          fi

          if [[ "${RELEASE_CONTRACT_INPUT_ARTIFACT_NAME}" != "${canonical_artifact_name}" ]]; then
            echo "release_contract_input_artifact_name must be ${canonical_artifact_name}." >&2
            exit 1
          fi

          mkdir -p "${gate_dir}"
          gh run view "${RELEASE_CONTRACT_INPUT_RUN_ID}" \
            --repo "${RELEASE_CONTRACT_REPO}" \
            --json conclusion,databaseId,headSha,url,workflowName \
            > "${gate_dir}/run-view.json"
          gh api "repos/${RELEASE_CONTRACT_REPO}/actions/runs/${RELEASE_CONTRACT_INPUT_RUN_ID}" \
            > "${gate_dir}/run-api.json"
          gh api "repos/${RELEASE_CONTRACT_REPO}/actions/runs/${RELEASE_CONTRACT_INPUT_RUN_ID}/jobs?per_page=100" \
            > "${gate_dir}/jobs-api.json"
          gh api "repos/${RELEASE_CONTRACT_REPO}/actions/runs/${RELEASE_CONTRACT_INPUT_RUN_ID}/artifacts?per_page=100" \
            > "${gate_dir}/artifacts-api.json"

          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const path = require('node:path');

          const gateDir = 'artifacts/release-contract/source-gate';
          const expected = {
            artifactName: process.env.RELEASE_CONTRACT_INPUT_SOURCE_ARTIFACT_NAME,
            currentSha: process.env.RELEASE_CONTRACT_CURRENT_SHA,
            jobName: process.env.RELEASE_CONTRACT_INPUT_SOURCE_JOB_NAME,
            repo: process.env.RELEASE_CONTRACT_REPO,
            runId: process.env.RELEASE_CONTRACT_INPUT_RUN_ID,
            workflowName: process.env.RELEASE_CONTRACT_INPUT_SOURCE_WORKFLOW_NAME,
            workflowPath: process.env.RELEASE_CONTRACT_INPUT_SOURCE_WORKFLOW_PATH,
          };
          const readJson = (fileName) => JSON.parse(readFileSync(path.join(gateDir, fileName), 'utf8'));
          const fail = (message) => {
            throw new Error(`release contract input source gate failed: ${message}`);
          };
          const isRecord = (value) => value && typeof value === 'object' && !Array.isArray(value);
          const readString = (value) => (typeof value === 'string' ? value : '');
          for (const [field, value] of Object.entries(expected)) {
            if (typeof value !== 'string' || value.trim().length === 0) {
              fail(`${field} is required.`);
            }
          }
          const runView = readJson('run-view.json');
          const runApi = readJson('run-api.json');
          const jobsApi = readJson('jobs-api.json');
          const artifactsApi = readJson('artifacts-api.json');
          const runIdNumber = Number(expected.runId);

          if (!isRecord(runView) || !isRecord(runApi)) {
            fail('GitHub run metadata must be JSON objects.');
          }
          if (runView.databaseId !== runIdNumber) {
            fail(`run id must resolve to ${expected.runId}.`);
          }
          if (runApi.repository?.full_name !== expected.repo) {
            fail(`run repository must be ${expected.repo}.`);
          }
          if (runApi.head_repository?.full_name && runApi.head_repository.full_name !== expected.repo) {
            fail(`run head repository must be ${expected.repo}.`);
          }
          if (runView.workflowName !== expected.workflowName || runApi.name !== expected.workflowName) {
            fail(`run workflow must be ${expected.workflowName}.`);
          }
          if (runApi.path !== expected.workflowPath) {
            fail(`run workflow path must be ${expected.workflowPath}.`);
          }
          if (runView.headSha !== expected.currentSha || runApi.head_sha !== expected.currentSha) {
            fail('run headSha must match the current release contract workflow sha.');
          }
          if (runView.conclusion !== 'success' || runApi.conclusion !== 'success') {
            fail('run conclusion must be success.');
          }

          const jobs = Array.isArray(jobsApi.jobs) ? jobsApi.jobs.filter(isRecord) : [];
          const publishJob = jobs.find((job) => job.name === expected.jobName);
          if (!publishJob) {
            fail(`run must include ${expected.jobName} job.`);
          }
          if (publishJob.conclusion !== 'success') {
            fail(`${expected.jobName} job conclusion must be success.`);
          }

          const artifacts = Array.isArray(artifactsApi.artifacts) ? artifactsApi.artifacts.filter(isRecord) : [];
          const matchingArtifacts = artifacts.filter((artifact) => artifact.name === expected.artifactName);
          if (matchingArtifacts.length !== 1) {
            fail(`run must contain exactly one ${expected.artifactName} artifact.`);
          }
          const artifact = matchingArtifacts[0];
          if (artifact.expired === true) {
            fail(`${expected.artifactName} artifact must not be expired.`);
          }
          if (
            isRecord(artifact.workflow_run)
            && readString(artifact.workflow_run.head_sha).length > 0
            && artifact.workflow_run.head_sha !== expected.currentSha
          ) {
            fail(`${expected.artifactName} artifact headSha must match the current release contract workflow sha.`);
          }

          writeFileSync(
            'artifacts/release-contract/input-source-gate.json',
            `${JSON.stringify({
              repo: expected.repo,
              run_id: expected.runId,
              workflow_name: runView.workflowName,
              workflow_path: runApi.path,
              head_sha: runView.headSha,
              conclusion: runView.conclusion,
              job_name: publishJob.name,
              job_conclusion: publishJob.conclusion,
              artifact_name: artifact.name,
              artifact_id: artifact.id,
              artifact_expired: artifact.expired === true,
              run_url: runView.url,
            }, null, 2)}\n`,
          );
          NODE

      - name: Download release contract input artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.release_contract_input_artifact_name }}
          run-id: ${{ inputs.release_contract_input_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/release-contract/input

      - name: Verify release contract input handoff files
        run: |
          set -euo pipefail
          input_dir="artifacts/release-contract/input"
          handoff_input_path="${input_dir}/release-contract-input.json"
          deploy_template_descriptor_path="${input_dir}/deploy-template-package.json"
          deploy_template_tgz_path="${input_dir}/agentsmith-deploy-template-package.tgz"

          test -f "${handoff_input_path}"
          test -f "${deploy_template_descriptor_path}"
          test -f "${deploy_template_tgz_path}"
          export RELEASE_CONTRACT_INPUT_PATH="${handoff_input_path}"
          export RELEASE_CONTRACT_DEPLOY_TEMPLATE_DESCRIPTOR_PATH="${deploy_template_descriptor_path}"
          export RELEASE_CONTRACT_DEPLOY_TEMPLATE_TGZ_SHA256="sha256:$(sha256sum "${deploy_template_tgz_path}" | awk '{print $1}')"

          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const fail = (message) => {
            throw new Error(`release contract input handoff file check failed: ${message}`);
          };
          const isRecord = (value) => value && typeof value === 'object' && !Array.isArray(value);
          const input = readJson(process.env.RELEASE_CONTRACT_INPUT_PATH);
          const descriptor = readJson(process.env.RELEASE_CONTRACT_DEPLOY_TEMPLATE_DESCRIPTOR_PATH);
          const inputPackage = isRecord(input) ? input.deployTemplatePackage : null;

          if (!isRecord(inputPackage)) {
            fail('release-contract-input.json must contain deployTemplatePackage.');
          }
          if (!isRecord(descriptor)) {
            fail('deploy-template-package.json must be an object.');
          }
          if (descriptor.package_sha256 !== process.env.RELEASE_CONTRACT_DEPLOY_TEMPLATE_TGZ_SHA256) {
            fail('deploy-template-package.json package_sha256 must match agentsmith-deploy-template-package.tgz.');
          }
          for (const field of ['package_uri', 'package_sha256', 'manifest_sha256']) {
            if (inputPackage[field] !== descriptor[field]) {
              fail(`release-contract-input.json deployTemplatePackage.${field} must match deploy-template-package.json.`);
            }
          }
          NODE

      - name: Generate release contract artifact
        env:
          RELEASE_CONTRACT_INPUT_ARTIFACT_NAME: ${{ inputs.release_contract_input_artifact_name }}
          RELEASE_CONTRACT_INPUT_RUN_ID: ${{ inputs.release_contract_input_run_id }}
          RELEASE_CONTRACT_REPO: ${{ github.repository }}
          RELEASE_CONTRACT_CONSUMER_RUN_ID: ${{ github.run_id }}
          RELEASE_CONTRACT_CONSUMER_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_CONTRACT_CONSUMER_JOB: ${{ github.job }}
          RELEASE_CONTRACT_CONSUMER_WORKFLOW: ${{ github.workflow }}
          RELEASE_CONTRACT_CONSUMER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # This workflow only produces a release contract artifact from a GitHub Actions handoff artifact.
          RELEASE_CONTRACT_INPUT_PATH="artifacts/release-contract/input/release-contract-input.json"
          RELEASE_CONTRACT_INPUT_SOURCE_GATE_PATH="artifacts/release-contract/input-source-gate.json"
          RUNNER_RELEASE_MANIFEST_PATH="scripts/governance/__fixtures__/release-boundary/runner-release-manifest.valid.json"
          RUNNER_RELEASE_MANIFEST_REMOTE_PATH="$(cat "artifacts/release-contract/runner-manifest-source-gate/remote-manifest-path.txt")"
          RUNNER_RELEASE_MANIFEST_RUN_VIEW_PATH="artifacts/release-contract/runner-manifest-source-gate/run-view.json"
          RUNNER_RELEASE_MANIFEST_RUN_API_PATH="artifacts/release-contract/runner-manifest-source-gate/run-api.json"
          RUNNER_RELEASE_MANIFEST_ARTIFACTS_API_PATH="artifacts/release-contract/runner-manifest-source-gate/artifacts-api.json"
          ASBCP_FINAL_MANIFEST_PATH="artifacts/release-contract/asbcp-final-manifest-source-gate/asbcp-final-manifest.json"
          ASBCP_RELEASE_API_PATH="artifacts/release-contract/asbcp-final-manifest-source-gate/release-api.json"
          ASBCP_ASSET_API_PATH="artifacts/release-contract/asbcp-final-manifest-source-gate/asset-api.json"
          RELEASE_CONTRACT_OUTPUT_DIR="artifacts/release-contract"
          export RELEASE_CONTRACT_INPUT_PATH RELEASE_CONTRACT_INPUT_SOURCE_GATE_PATH RELEASE_CONTRACT_OUTPUT_DIR
          mkdir -p "${RELEASE_CONTRACT_OUTPUT_DIR}"
          rm -f "${RELEASE_CONTRACT_OUTPUT_DIR}/agentsmith-release-contract.json"
          rm -f "${RELEASE_CONTRACT_OUTPUT_DIR}/release-contract-input-source.json"
          rm -f "${RELEASE_CONTRACT_OUTPUT_DIR}/runner-release-manifest-source.json"
          rm -f "${RELEASE_CONTRACT_OUTPUT_DIR}/asbcp-final-manifest-source.json"
          test -f "${RELEASE_CONTRACT_INPUT_PATH}"
          test -f "${RELEASE_CONTRACT_INPUT_SOURCE_GATE_PATH}"
          test -f "${RUNNER_RELEASE_MANIFEST_PATH}"
          test -f "${RUNNER_RELEASE_MANIFEST_REMOTE_PATH}"
          test -f "${RUNNER_RELEASE_MANIFEST_RUN_VIEW_PATH}"
          test -f "${RUNNER_RELEASE_MANIFEST_RUN_API_PATH}"
          test -f "${RUNNER_RELEASE_MANIFEST_ARTIFACTS_API_PATH}"
          test -f "${ASBCP_FINAL_MANIFEST_PATH}"
          test -f "${ASBCP_RELEASE_API_PATH}"
          test -f "${ASBCP_ASSET_API_PATH}"
          export RELEASE_CONTRACT_INPUT_SHA256="$(sha256sum "${RELEASE_CONTRACT_INPUT_PATH}" | awk '{print $1}')"
          npm run release:contract:ci-artifact -- \
            --input "${RELEASE_CONTRACT_INPUT_PATH}" \
            --output-dir "${RELEASE_CONTRACT_OUTPUT_DIR}" \
            --runner-manifest "${RUNNER_RELEASE_MANIFEST_PATH}" \
            --runner-remote-manifest "${RUNNER_RELEASE_MANIFEST_REMOTE_PATH}" \
            --runner-run-view "${RUNNER_RELEASE_MANIFEST_RUN_VIEW_PATH}" \
            --runner-run-api "${RUNNER_RELEASE_MANIFEST_RUN_API_PATH}" \
            --runner-artifacts-api "${RUNNER_RELEASE_MANIFEST_ARTIFACTS_API_PATH}" \
            --asbcp-final-manifest "${ASBCP_FINAL_MANIFEST_PATH}" \
            --asbcp-release-api "${ASBCP_RELEASE_API_PATH}" \
            --asbcp-asset-api "${ASBCP_ASSET_API_PATH}"
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/agentsmith-release-contract.json"
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/runner-release-manifest-source.json"
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/asbcp-final-manifest-source.json"
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const receipt = {
            input_run_id: process.env.RELEASE_CONTRACT_INPUT_RUN_ID,
            input_artifact_name: process.env.RELEASE_CONTRACT_INPUT_ARTIFACT_NAME,
            repo: process.env.RELEASE_CONTRACT_REPO,
            input_sha256: process.env.RELEASE_CONTRACT_INPUT_SHA256,
            validated_source: JSON.parse(readFileSync(process.env.RELEASE_CONTRACT_INPUT_SOURCE_GATE_PATH, 'utf8')),
            consumer_run_id: process.env.RELEASE_CONTRACT_CONSUMER_RUN_ID,
            consumer_run_attempt: process.env.RELEASE_CONTRACT_CONSUMER_RUN_ATTEMPT,
            consumer_job: process.env.RELEASE_CONTRACT_CONSUMER_JOB,
            consumer_workflow: process.env.RELEASE_CONTRACT_CONSUMER_WORKFLOW,
            consumer_sha: process.env.RELEASE_CONTRACT_CONSUMER_SHA,
          };

          writeFileSync(
            `${process.env.RELEASE_CONTRACT_OUTPUT_DIR}/release-contract-input-source.json`,
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/release-contract-input-source.json"
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/runner-release-manifest-source.json"
          test -f "${RELEASE_CONTRACT_OUTPUT_DIR}/asbcp-final-manifest-source.json"

      - name: Upload release contract artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentsmith-release-contract
          if-no-files-found: error
          path: |
            artifacts/release-contract/agentsmith-release-contract.json
            artifacts/release-contract/release-contract-input-source.json
            artifacts/release-contract/runner-release-manifest-source.json
            artifacts/release-contract/asbcp-final-manifest-source.json
