asyncapi: 3.0.0
info:
  title: MBOS Agent Task Runner Execution Channel
  version: 1.0.0
  description: Runtime WebSocket protocol between MBOS and task-only Agent Runners.
servers:
  local:
    host: localhost:20000
    pathname: /api/v1/agent-execution/ws
    protocol: ws
    description: 'Use query parameter agent_runner_id and header Authorization: Bearer ask_*'
channels:
  agentRuntime:
    address: /api/v1/agent-execution/ws?agent_runner_id={agentRunnerId}
    parameters:
      agentRunnerId:
        description: Agent Runner identifier
        location: $message.header#/agent_runner_id
    messages:
      serverHello:
        $ref: '#/components/messages/serverHello'
      serverRequestStart:
        $ref: '#/components/messages/serverRequestStart'
      serverRequestCancel:
        $ref: '#/components/messages/serverRequestCancel'
      serverPing:
        $ref: '#/components/messages/serverPing'
      serverTerminalStart:
        $ref: '#/components/messages/serverTerminalStart'
      agentReady:
        $ref: '#/components/messages/agentReady'
      agentPong:
        $ref: '#/components/messages/agentPong'
      agentResponseDelta:
        $ref: '#/components/messages/agentResponseDelta'
      agentResponseDone:
        $ref: '#/components/messages/agentResponseDone'
      agentResponseError:
        $ref: '#/components/messages/agentResponseError'
      agentResponseEvent:
        $ref: '#/components/messages/agentResponseEvent'
      agentResponseArtifact:
        $ref: '#/components/messages/agentResponseArtifact'
      serverTerminalAdopt:
        $ref: '#/components/messages/serverTerminalAdopt'
      serverTerminalClose:
        $ref: '#/components/messages/serverTerminalClose'
      agentTerminalAdopted:
        $ref: '#/components/messages/agentTerminalAdopted'
      agentTerminalNotFound:
        $ref: '#/components/messages/agentTerminalNotFound'
      agentTerminalCloseAck:
        $ref: '#/components/messages/agentTerminalCloseAck'
operations:
  receiveFromServer:
    action: receive
    channel:
      $ref: '#/channels/agentRuntime'
    messages:
    - $ref: '#/channels/agentRuntime/messages/serverHello'
    - $ref: '#/channels/agentRuntime/messages/serverRequestStart'
    - $ref: '#/channels/agentRuntime/messages/serverRequestCancel'
    - $ref: '#/channels/agentRuntime/messages/serverPing'
    - $ref: '#/channels/agentRuntime/messages/serverTerminalStart'
    - $ref: '#/channels/agentRuntime/messages/serverTerminalAdopt'
    - $ref: '#/channels/agentRuntime/messages/serverTerminalClose'
  sendToServer:
    action: send
    channel:
      $ref: '#/channels/agentRuntime'
    messages:
    - $ref: '#/channels/agentRuntime/messages/agentReady'
    - $ref: '#/channels/agentRuntime/messages/agentPong'
    - $ref: '#/channels/agentRuntime/messages/agentResponseDelta'
    - $ref: '#/channels/agentRuntime/messages/agentResponseDone'
    - $ref: '#/channels/agentRuntime/messages/agentResponseError'
    - $ref: '#/channels/agentRuntime/messages/agentResponseEvent'
    - $ref: '#/channels/agentRuntime/messages/agentResponseArtifact'
    - $ref: '#/channels/agentRuntime/messages/agentTerminalAdopted'
    - $ref: '#/channels/agentRuntime/messages/agentTerminalNotFound'
    - $ref: '#/channels/agentRuntime/messages/agentTerminalCloseAck'
components:
  schemas:
    Envelope:
      type: object
      required:
      - type
      - timestamp
      - payload
      properties:
        type:
          type: string
        request_id:
          type: string
        runner_session_id:
          type: string
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    AgentResponseEventPayload:
      type: object
      required:
      - sequence
      - at
      - category
      - name
      - summary
      properties:
        sequence:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        category:
          type: string
          enum:
          - lifecycle
          - progress
          - tool
          - artifact
          - warning
          - error
          - debug
        phase:
          type: string
          enum:
          - start
          - update
          - end
        status:
          type: string
          enum:
          - running
          - success
          - error
          - cancelled
        name:
          type: string
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Sanitized event metadata (must not contain tokens/secrets).
        raw:
          type: string
          description: Sanitized raw snippet/source text for fidelity-oriented UI/debug rendering.
    AgentResponseArtifactPayload:
      type: object
      required:
      - filename
      - task_relative_path
      - artifact_type
      properties:
        filename:
          type: string
        task_relative_path:
          type: string
          description: Relative artifact path under `.artifacts`.
        artifact_type:
          type: string
          enum:
          - text
          - image
          - file
          - other
        mime_type:
          type: string
        file_size:
          type: integer
          minimum: 0
        title:
          type: string
        content:
          type: string
          description: Text preview or inline data URL (sanitized and size-limited).
        thumbnail_url:
          type: string
          description: Thumbnail URL or inline data URL for image artifacts.
    RunnerActiveTerminalDescriptor:
      type: object
      required:
      - terminal_session_id
      - runner_session_id
      - generation
      - cols
      - rows
      properties:
        terminal_session_id:
          type: string
        runner_session_id:
          type: string
        generation:
          type: integer
          minimum: 1
        cols:
          type: integer
          minimum: 20
        rows:
          type: integer
          minimum: 5
        cwd:
          type: string
    TaskExecutionContext: &TaskExecutionContext
      type: object
      description: Public TaskExecutionContext for task runs and terminal startup; request-scoped resource_proxy, projected_dependencies, and agent_task_model snapshot are carried here, while terminal contexts use task_id, runner_id, runner_session_scope and must not include legacy top-level session_id, agent_id, interaction_kind, user_bearer_token, credential_files, context_store, managed_credential_refresh, or writable_scopes.
      additionalProperties: false
      required:
      - task_id
      - workspace_file_library_id
      - workspace_binding_mode
      - runtime_profile
      - task_home_segment
      - task_home_path
      - workspace_path
      - artifacts_path
      - library_root_path
      properties:
        api_base:
          type: string
        workspace_id:
          type: string
        project_id:
          type: string
        task_id:
          type: string
          minLength: 1
          pattern: '\S'
        run_id:
          type: string
        runner_id:
          type: string
        runner_session_scope:
          type: string
          enum:
          - agent_presence
          - task_execution
        execution_ticket:
          type: string
        endpoint_id:
          type: string
        agent_task_model:
          type: object
          additionalProperties: false
          required:
          - endpoint_id
          - resolved_model
          - setting_revision
          - resolved_at
          properties:
            endpoint_id:
              type: string
              minLength: 1
              pattern: '\S'
            endpoint_display_name:
              type: string
            resolved_model:
              type: string
              minLength: 1
              pattern: '\S'
            upstream_protocol:
              type: string
              enum:
              - openai_chat_completions
              - openai_responses
              - anthropic_messages
            setting_revision:
              type: string
              minLength: 1
              pattern: '\S'
            policy_decision_id:
              type: string
            resolved_at:
              type: string
              minLength: 1
              pattern: '\S'
              format: date-time
        resource_proxy:
          type: object
          additionalProperties: false
          required:
          - base_url
          properties:
            base_url:
              type: string
              minLength: 1
              pattern: '\S'
        projected_dependencies:
          type: object
          additionalProperties: false
          required:
          - dependencies
          properties:
            dependencies:
              type: object
              minProperties: 1
              additionalProperties:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - fields
                  properties:
                    fields:
                      type: object
                      minProperties: 1
                      propertyNames:
                        type: string
                        pattern: '^(?!(?:context[_]store|writable[_]scopes|managed[_]credential[_]refresh|credential[_]files|user[_]bearer[_]token)$).*'
                      additionalProperties:
                        type: string
                        minLength: 1
                        pattern: '\S'
                - type: string
                  minLength: 1
                  pattern: '\S'
        wire_api:
          type: string
          enum:
          - openai_chat_completions
          - openai_responses
          - anthropic_messages
        model:
          type: string
        username:
          type: string
        workspace_file_library_id:
          type: string
          minLength: 1
          pattern: '\S'
        workspace_binding_mode:
          type: string
          enum:
          - file_library
          - pre_mounted
        runtime_profile:
          type: string
          enum:
          - managed
          - developer
        task_home_segment:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        task_home_path:
          type: string
          minLength: 1
          pattern: '^(?!.*(?:^|/)[.][.](?:/|$))/'
        workspace_path:
          type: string
          minLength: 1
          pattern: '^(?!.*(?:^|/)[.][.](?:/|$))/'
        artifacts_path:
          type: string
          minLength: 1
          pattern: '^(?!.*(?:^|/)[.][.](?:/|$))/'
        library_root_path:
          const: '.'
        workspace_file_library_name:
          oneOf:
          - type: string
          - type: 'null'
        task_inputs:
          type: array
          items:
            type: object
            additionalProperties: true
        model_context_window:
          type: integer
          minimum: 1
        model_auto_compact_token_limit:
          type: integer
          minimum: 1
        model_limits:
          type: object
          additionalProperties: false
          properties:
            context_window:
              type: integer
              minimum: 1
            max_output_tokens:
              type: integer
              minimum: 1
        model_catalog:
          type: object
          additionalProperties: false
          properties:
            input_modalities:
              type: array
              items:
                type: string
            supports_search_tool:
              type: boolean
            supports_parallel_tool_calls:
              type: boolean
            apply_patch_tool_type:
              type: string
              enum:
              - freeform
              - function
  messages:
    serverHello:
      name: server.hello
      payload:
        type: object
        required:
        - type
        - timestamp
        - payload
        properties:
          type:
            const: server.hello
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - protocol_version
            - heartbeat_interval_sec
            properties:
              protocol_version:
                type: string
              heartbeat_interval_sec:
                type: integer
    serverRequestStart:
      name: server.request.start
      payload:
        type: object
        required:
        - type
        - timestamp
        - request_id
        - payload
        properties:
          type:
            const: server.request.start
          request_id:
            type: string
          runner_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - model
            - stream
            - messages
            - execution_context
            properties:
              model:
                type: string
              stream:
                const: true
              messages:
                type: array
                items:
                  type: object
                  additionalProperties: true
              execution_context: *TaskExecutionContext
    serverRequestCancel:
      name: server.request.cancel
      payload:
        type: object
        required:
        - type
        - timestamp
        - request_id
        - payload
        properties:
          type:
            const: server.request.cancel
          request_id:
            type: string
          runner_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - reason
            properties:
              reason:
                type: string
    serverPing:
      name: server.ping
      payload:
        type: object
        required:
        - type
        - timestamp
        - payload
        properties:
          type:
            const: server.ping
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
    serverTerminalStart:
      name: server.terminal.start
      payload:
        type: object
        required:
        - type
        - runner_session_id
        - terminal_session_id
        - timestamp
        - payload
        properties:
          type:
            const: server.terminal.start
          runner_session_id:
            type: string
          terminal_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - cols
            - rows
            - execution_context
            properties:
              cols:
                type: integer
                minimum: 20
              rows:
                type: integer
                minimum: 5
              shell:
                type: string
              cwd:
                type: string
              execution_context: *TaskExecutionContext
    serverTerminalAdopt:
      name: server.terminal.adopt
      payload:
        type: object
        required:
        - type
        - request_id
        - runner_session_id
        - terminal_session_id
        - timestamp
        - payload
        properties:
          type:
            const: server.terminal.adopt
          request_id:
            type: string
          runner_session_id:
            type: string
          terminal_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - adopt_attempt_id
            - connection_epoch
            - generation
            - cols
            - rows
            properties:
              adopt_attempt_id:
                type: string
              connection_epoch:
                type: integer
                minimum: 1
              generation:
                type: integer
                minimum: 1
              cols:
                type: integer
                minimum: 20
              rows:
                type: integer
                minimum: 5
    serverTerminalClose:
      name: server.terminal.close
      payload:
        type: object
        required:
        - type
        - request_id
        - runner_session_id
        - terminal_session_id
        - timestamp
        - payload
        properties:
          type:
            const: server.terminal.close
          request_id:
            type: string
          runner_session_id:
            type: string
          terminal_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - close_attempt_id
            - generation
            - connection_epoch
            - reason
            properties:
              close_attempt_id:
                type: string
              generation:
                type: integer
                minimum: 1
              connection_epoch:
                type: integer
                minimum: 1
              reason:
                type: string
                enum:
                - user_requested
                - permission_revoked
                - garbage_collect
                - shutdown
    agentReady:
      name: agent.ready
      payload:
        type: object
        required:
        - type
        - timestamp
        - payload
        properties:
          type:
            const: agent.ready
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            additionalProperties: true
            properties:
              runner_instance_id:
                type: string
              connection_epoch:
                type: integer
                minimum: 1
              active_terminals:
                type: array
                maxItems: 64
                items:
                  $ref: '#/components/schemas/RunnerActiveTerminalDescriptor'
    agentPong:
      name: agent.pong
      payload:
        type: object
        required:
        - type
        - timestamp
        - payload
        properties:
          type:
            const: agent.pong
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
    agentTerminalAdopted:
      name: agent.terminal.adopted
      payload:
        type: object
        required:
        - type
        - request_id
        - terminal_session_id
        - payload
        properties:
          type:
            const: agent.terminal.adopted
          request_id:
            type: string
          terminal_session_id:
            type: string
          payload:
            type: object
            required:
            - terminal_session_id
            - runner_session_id
            - adopt_attempt_id
            - connection_epoch
            - generation
            properties:
              terminal_session_id:
                type: string
              runner_session_id:
                type: string
              adopt_attempt_id:
                type: string
              connection_epoch:
                type: integer
                minimum: 1
              generation:
                type: integer
                minimum: 1
              cols:
                type: integer
                minimum: 20
              rows:
                type: integer
                minimum: 5
    agentTerminalNotFound:
      name: agent.terminal.not_found
      payload:
        type: object
        required:
        - type
        - terminal_session_id
        - payload
        properties:
          type:
            const: agent.terminal.not_found
          terminal_session_id:
            type: string
          payload:
            type: object
            required:
            - terminal_session_id
            - runner_session_id
            - adopt_attempt_id
            properties:
              terminal_session_id:
                type: string
              runner_session_id:
                type: string
              adopt_attempt_id:
                type: string
    agentTerminalCloseAck:
      name: agent.terminal.close_ack
      payload:
        type: object
        required:
        - type
        - request_id
        - runner_session_id
        - terminal_session_id
        - timestamp
        - payload
        properties:
          type:
            const: agent.terminal.close_ack
          request_id:
            type: string
          runner_session_id:
            type: string
          terminal_session_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - terminal_session_id
            - runner_session_id
            - close_attempt_id
            - generation
            - connection_epoch
            - status
            properties:
              terminal_session_id:
                type: string
              runner_session_id:
                type: string
              close_attempt_id:
                type: string
              generation:
                type: integer
                minimum: 1
              connection_epoch:
                type: integer
                minimum: 1
              status:
                type: string
                enum:
                - closed
                - not_found
                - error
              diagnostic_code:
                type: string
              remaining_pid_count:
                type: integer
                minimum: 0
    agentResponseDelta:
      name: agent.response.delta
      payload:
        type: object
        required:
        - type
        - timestamp
        - request_id
        - payload
        properties:
          type:
            const: agent.response.delta
          request_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - delta
            properties:
              delta:
                type: string
    agentResponseDone:
      name: agent.response.done
      payload:
        type: object
        required:
        - type
        - timestamp
        - request_id
        - payload
        properties:
          type:
            const: agent.response.done
          request_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - finish_reason
            properties:
              finish_reason:
                type: string
              usage_tokens:
                type: integer
    agentResponseError:
      name: agent.response.error
      payload:
        type: object
        required:
        - type
        - timestamp
        - request_id
        - payload
        properties:
          type:
            const: agent.response.error
          request_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            type: object
            required:
            - error_code
            - error_message
            properties:
              error_code:
                type: string
              error_message:
                type: string
    agentResponseEvent:
      name: agent.response.event
      summary: Structured execution telemetry event (agent task diagnostics and
        expandable trace UI)
      payload:
        type: object
        required:
        - type
        - request_id
        - timestamp
        - payload
        properties:
          type:
            const: agent.response.event
          request_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            $ref: '#/components/schemas/AgentResponseEventPayload'
    agentResponseArtifact:
      name: agent.response.artifact
      summary: Artifact emitted by the runner for agent task outputs discovered
        in the task workspace `.artifacts` directory.
      payload:
        type: object
        required:
        - type
        - request_id
        - timestamp
        - payload
        properties:
          type:
            const: agent.response.artifact
          request_id:
            type: string
          timestamp:
            type: string
            format: date-time
          payload:
            $ref: '#/components/schemas/AgentResponseArtifactPayload'
