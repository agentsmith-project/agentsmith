        "403": *a2
        "404": *a3
        "409":
          description: Activation blocked by missing pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/runtime/pricing/compare:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    post:
      tags:
        - LLM Runtime
      operationId: compareRuntimePricingVersions
      summary: Compare runtime pricing versions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimePricingVersionCompareRequest"
      responses:
        "200":
          description: Pricing version comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePricingCompareResponse"
        "401": *a1
        "403": *a2
        "404": *a3
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Operations
      operationId: listAlertRules
      summary: List alert rules
      description: |
        Returns all alert rules for the project. Rules can be filtered by enabled status,
        severity, and alert type.
      parameters:
        - name: enabled
          in: query
          description: Filter by enabled status
          required: false
          schema:
            type: boolean
        - name: severity
          in: query
          description: Filter by severity level
          required: false
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: type
          in: query
          description: Filter by alert type
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Alert rules list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
    post:
      tags:
        - Operations
      operationId: createAlertRule
      summary: Create alert rule
      description: |
        Creates a new alert rule for the project. The rule defines trigger conditions,
        notification channels, and behavior settings.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleCreateRequest"
      responses:
        "201":
          description: Alert rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: ruleId
        in: path
        required: true
        description: Alert rule ID
        schema:
          type: string
    get:
      tags:
        - Operations
      operationId: getAlertRule
      summary: Get alert rule
      description: Returns a single alert rule by ID
      responses:
        "200":
          description: Alert rule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
        "404": *a3
    put:
      tags:
        - Operations
      operationId: updateAlertRule
      summary: Update alert rule
      description: |
        Updates an existing alert rule. Only provide fields that should be changed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdateRequest"
      responses:
        "200":
          description: Alert rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "401": *a1
        "403": *a2
        "404": *a3
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - Operations
      operationId: deleteAlertRule
      summary: Delete alert rule
      description: Permanently deletes an alert rule
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Alert rule deleted
        "401": *a1
        "403": *a2
        "404": *a3
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-rules/{ruleId}/test:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: ruleId
        in: path
        required: true
        description: Alert rule ID
        schema:
          type: string
    post:
      tags:
        - Operations
      operationId: testAlertRule
      summary: Test alert rule
      description: |
        Evaluates the alert rule against current data to check if it would trigger.
        Returns the test result without actually sending any notifications.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleTestResponse"
        "401": *a1
        "403": *a2
        "404": *a3
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-notifications:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Operations
      operationId: listAlertNotifications
      summary: List alert notifications
      description: |
        Returns alert notifications (triggered alert instances) for the project.
        Supports filtering by status, time range, and rule.
      parameters:
        - name: status
          in: query
          description: Filter by notification status
          required: false
          schema:
            type: string
            enum: [firing, resolved, silenced]
        - name: rule_id
          in: query
          description: Filter by alert rule
          required: false
          schema:
            type: string
        - name: start_time
          in: query
          description: Start time in ISO 8601 format
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: End time in ISO 8601 format
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: Items per page
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Alert notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertNotificationsListResponse"
        "401": *a1
        "403": *a2
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/alert-notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - name: notificationId
        in: path
        required: true
        description: Alert notification ID
        schema:
          type: string
    put:
      tags:
        - Operations
      operationId: updateAlertNotification
      summary: Update alert notification status
      description: |
        Updates the status of an alert notification (e.g., mark as resolved or silenced).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SilenceNotificationRequest"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertNotification"
        "401": *a1
        "403": *a2
        "404": *a3
components:
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    streamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    endpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
    libraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "UNAUTHORIZED"
            message: "Missing or invalid authorization token"
    Forbidden:
      description: Forbidden - Valid token but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "PERMISSION_DENIED"
            message: "You do not have permission to perform this action"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RESOURCE_NOT_FOUND"
            message: "The requested resource does not exist"
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "VALIDATION_ERROR"
            message: "Invalid request parameters"
    Conflict:
      description: Conflict - Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RESOURCE_ALREADY_EXISTS"
            message: "A resource with this identifier already exists"
    RateLimited:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RATE_LIMIT_EXCEEDED"
            message: "Rate limit exceeded. Please retry after a few seconds"
    QuotaExceeded:
      description: Quota Exceeded - Resource quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "QUOTA_EXCEEDED"
            message: "Resource quota exceeded"
    InternalError:
      description: Internal Server Error - Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "INTERNAL_ERROR"
            message: "An unexpected error occurred. Please try again later"
  schemas:
    Workspace:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        system_managed_kind:
          type: string
          enum:
            - default_personal_uploads
    Project:
      type: object
      required:
        - id
        - workspace_id
        - name
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    ChatSession:
      type: object
      required:
        - id
        - title
        - model
      properties:
        id:
          type: string
        title:
          type: string
        model:
          type: string
        endpoint_id:
          type: string
        external_agent_id:
          type: string
    CreateChatSessionRequest:
      type: object
      required:
        - title
        - model
      properties:
        title:
          type: string
        model:
          type: string
        endpoint_id:
          type: string
        external_agent_id:
          type: string
    UpdateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
        model:
          type: string
        endpoint_id:
          type: string
        external_agent_id:
          type: string
        pinned:
          type: boolean
        starred:
          type: boolean
    ChatMessage:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          oneOf:
            - type: string
            - type: array
    CreateChatMessageRequest:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          oneOf:
            - type: string
            - type: array
        inputs:
          type: array
          items:
            type: object
            required:
              - kind
            properties:
              kind:
                type: string
                enum:
                  - library_object
                  - url
              library_id:
                type: string
              key:
                type: string
              name:
                type: string
              content_type:
                type: string
              size_bytes:
                type: integer
              url:
                type: string
              imported_library_id:
                type: string
              imported_key:
                type: string
    ChatAttachment:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        input_ref:
          type: object
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - library_object
                - url
            library_id:
              type: string
            key:
              type: string
            name:
              type: string
            content_type:
              type: string
            size_bytes:
              type: integer
            url:
              type: string
            imported_library_id:
              type: string
            imported_key:
              type: string
    Agent:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
    CreateAgentRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - external
        description:
          type: string
        runtime_preferences:
          type: object
          additionalProperties: true
    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        runtime_preferences:
          type: object
          additionalProperties: true
    AgentKey:
      type: object
      required:
        - id
        - key_prefix
        - status
      properties:
        id:
          type: string
        key_prefix:
          type: string
        status:
          type: string
          enum:
            - active
            - revoked
        created_at:
          type: string
          format: date-time
    CreateAgentKeyResponse:
      type: object
      required:
        - id
        - key_prefix
      properties:
        id:
          type: string
        key_prefix:
          type: string
        key:
          type: string
          description: Displayed only once
    Endpoint:
      type: object
      required:
        - id
        - name
        - capability
        - provider
        - base_url
        - openai_model
      properties:
        id:
          type: string
        name:
          type: string
        capability:
          type: string
        provider:
          type: string
        base_url:
          type: string
        openai_model:
          type: string
    CreateEndpointRequest:
      type: object
      required:
        - name
        - capability
        - provider
        - base_url
        - openai_model
        - credential_id
      properties:
        name:
          type: string
        description:
          type: string
        capability:
          type: string
        provider:
          type: string
        base_url:
          type: string
        openai_model:
          type: string
        credential_id:
          type: string
    UpdateEndpointRequest:
      allOf:
        - $ref: "#/components/schemas/CreateEndpointRequest"
    FileLibrary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    CreateFileLibraryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    SourceObject:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
        name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
    ApiError:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Machine-readable error code
          enum:
            - UNAUTHORIZED
            - PERMISSION_DENIED
            - RESOURCE_NOT_FOUND
            - RESOURCE_ALREADY_EXISTS
            - VALIDATION_ERROR
            - RATE_LIMIT_EXCEEDED
            - QUOTA_EXCEEDED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error message
        request_id:
          type: string
          description: Unique identifier for the request (for debugging)
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
    TaskTraceEvent:
      type: object
      required:
        - id
        - task_id
        - message_id
        - run_id
        - seq
        - at
        - category
        - name
        - summary
      properties:
        id:
          type: string
        task_id:
          type: string
        message_id:
          type: string
        run_id:
          type: string
        seq:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        category:
          type: string
          enum:
            - lifecycle
            - progress
            - tool
            - artifact
            - warning
            - error
            - debug
        phase:
          type: string
          enum:
            - start
            - update
            - end
        status:
          type: string
          enum:
            - running
            - success
            - error
            - cancelled
        name:
          type: string
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Sanitized structured detail payload (no secrets/tokens).
    TaskTraceListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskTraceEvent"
        total:
          type: integer
          minimum: 0
        has_more:
          type: boolean
          description: Indicates older events are available for pagination.
        next_after_id:
          type: string
          nullable: true
          description: Cursor for loading an earlier slice using `before_id`.
    # ============================================================================
    # M1: Architecture & Contract Freeze - New Schemas
    # ============================================================================
    AuthorizationRequest:
      type: object
      required:
        - subject
        - action
        - resource
      properties:
        subject:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: [user, group, agent]
            id:
              type: string
        action:
          type: string
          description: e.g., "endpoint.invoke", "project.delete"
          examples:
            - endpoint.invoke
            - project.delete
            - source.file.upload
        resource:
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: [project, endpoint, source_library, agent]
            id:
              type: string
        context:
          type: object
          properties:
            end_user_id:
              type: string
            metadata:
              type: object
              additionalProperties: true
    AuthorizationResponse:
      type: object
      required:
        - allowed
        - decision
      properties:
        allowed:
          type: boolean
        decision:
          type: object
          required:
            - source
            - reason
          properties:
            source:
              type: string
              enum: [permission, resource_policy, project_default]
            rule_id:
              type: string
            reason:
              type: string
        matched_policy:
          type: object
          properties:
            id:
              type: string
            resource_type:
              type: string
            resource_id:
              type: string
            access_mode:
              type: string
              enum: [allow_all_members, allow_list]
            matched_subject:
              type: object
              properties:
                type:
                  type: string
                  enum: [user, group]
                id:
                  type: string
    QuotaCheckRequest:
      type: object
      required:
        - subject_id
        - resource_type
        - resource_id
        - operation
      properties:
        subject_id:
          type: string
          description: User ID, group ID, or agent ID
        resource_type:
          type: string
          enum: [endpoint, source_library, agent]
        resource_id:
          type: string
        operation:
          type: string
          enum: [invoke, upload, create]
        estimated_cost:
          type: number
          description: Estimated tokens/bytes for the operation
          minimum: 0
    QuotaCheckResponse:
      type: object
      required:
        - allowed
        - quota_remaining
        - quota_limit
        - quota_reset_at
        - policy_id
      properties:
        allowed:
          type: boolean
        quota_remaining:
          type: number
          minimum: 0
        quota_limit:
          type: number
          minimum: 0
        quota_reset_at:
          type: string
          format: date-time
        policy_id:
          type: string
    AuditExportResponse:
      type: object
      required:
        - export_id
        - generated_at
        - time_range
        - filter
        - events
      properties:
        export_id:
          type: string
        generated_at:
          type: string
          format: date-time
        time_range:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        filter:
          type: object
          properties:
            workspace_id:
              type: string
            project_id:
              type: string
            action:
              type: string
            actor_type:
              type: string
            result:
              type: string
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              timestamp:
                type: string
                format: date-time
              workspace_id:
                type: string
              project_id:
                type: string
              actor_type:
                type: string
                enum: [user, agent, plugin]
              actor_id:
                type: string
              action:
                type: string
              resource_type:
                type: string
              resource_id:
                type: string
              end_user_id:
                type: string
              result:
                type: string
                enum: [ok, error]
              error_code:
                type: string
              error_message:
                type: string
              request_id:
                type: string
              metadata_json:
                type: object
                additionalProperties: true
              # Authorization-specific fields (for authorization.* actions)
              authz_subject:
                type: object
                properties:
                  type:
                    type: string
                    enum: [user, group, agent]
                  id:
                    type: string
              authz_action:
                type: string
              authz_resource:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
              authz_decision:
                type: object
                properties:
                  allowed:
                    type: boolean
                  source:
                    type: string
                    enum: [permission, resource_policy, project_default, allow_list]
                  reason:
                    type: string
                  policy_id:
                    type: string
              # Usage-specific fields (for quota.* actions)
              usage_metrics:
                type: object
                properties:
                  quantity:
                    type: number
                  unit:
                    type: string
                    enum: [tokens, bytes, requests, seconds]
              quota_remaining:
                type: number
              quota_limit:
                type: number
              quota_reset_at:
                type: string
                format: date-time
              policy_id:
                type: string
    SSETicketRequest:
      type: object
      required:
        - workspace_id
        - intended_use
      properties:
        workspace_id:
          type: string
        project_id:
          type: string
        intended_use:
          type: string
          enum: [task_events, chat_stream, other]
    SSETicketResponse:
      type: object
      required:
        - ticket
        - expires_at
        - sso_url
        - max_connections
      properties:
        ticket:
          type: string
          description: Short-lived token (UUID)
        expires_at:
          type: string
          format: date-time
