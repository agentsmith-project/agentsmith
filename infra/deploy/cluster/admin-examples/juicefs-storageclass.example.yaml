# Edit before apply:
# - keep the name aligned with INTERNAL_AGENT_JUICEFS_STORAGE_CLASS_NAME in site.env
# - make sure the secret name and namespace match juicefs-csi-secret.example.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs-sc
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-csi-secret
  csi.storage.k8s.io/provisioner-secret-namespace: mbos
  csi.storage.k8s.io/controller-expand-secret-name: juicefs-csi-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: mbos
  csi.storage.k8s.io/node-stage-secret-name: juicefs-csi-secret
  csi.storage.k8s.io/node-stage-secret-namespace: mbos
