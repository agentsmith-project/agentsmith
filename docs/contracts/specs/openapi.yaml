        - Governance
      operationId: checkQuota
      summary: Verify quota before operation
      description: |
        Checks if a subject has sufficient quota remaining to perform an operation.
        Returns quota status including remaining amount, limit, and reset time.
      requestBody:
        required: true
        content:
