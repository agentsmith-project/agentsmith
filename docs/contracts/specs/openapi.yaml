      type: object
      description: Paginated list of alert notifications
      required:
        - items
        - total
        - page
        - page_size
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertNotification'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_more:
          type: boolean
    AlertNotification:
      type: object
      description: Alert notification (triggered alert instance)
      required:
        - id
        - rule_id
        - rule_name
        - status
        - triggered_at
        - metric
        - operator
        - threshold
        - actual_value
        - context
        - delivery
      properties:
        id:
          type: string
        rule_id:
          type: string
        rule_name:
          type: string
        status:
          $ref: '#/components/schemas/AlertStatus'
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        metric:
          $ref: '#/components/schemas/AlertMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        actual_value:
          type: number
        context:
          $ref: '#/components/schemas/AlertContext'
        delivery:
          $ref: '#/components/schemas/AlertDelivery'
