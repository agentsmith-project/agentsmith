name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_backend_real_core:
        description: "Run the core backend-real lane (requires BACKEND_REAL_API_KEY secret)"
        required: false
        default: false
        type: boolean
      run_visual_lane:
        description: "Run the full visual lane"
        required: false
        default: false
        type: boolean

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-fast:
    name: gate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run gate-fast
        run: npm run gate:fast

      - name: Upload fast gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-fast-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/mock-lane/runs/**
            test-results/**
            playwright-report/**

  gate-default:
    name: gate-default
    needs: gate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run gate-default
        run: npm run gate:default

      - name: Upload default gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-default-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/mock-lane/runs/**
            test-results/**
            playwright-report/**

  lane-visual:
    name: lane-visual
    needs: gate-fast
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_visual_lane) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run lane-visual
        run: npm run lane:visual

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-visual-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/gate-results/lane-visual/**
            artifacts/visual-baseline-reviews/**
            artifacts/mock-lane/runs/**
            test-results/**
            playwright-report/**

  lane-backend-real-core:
    name: lane-backend-real-core
    needs: gate-fast
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backend_real_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKEND_REAL_API_KEY: ${{ secrets.BACKEND_REAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_REAL_API_KEY:-}" ]]; then
            echo "BACKEND_REAL_API_KEY secret is required for the core backend-real lane." >&2
            exit 1
          fi

      - name: Materialize backend-real endpoint env
        run: |
          set -euo pipefail
          umask 077
          printf 'PRESET_ENDPOINT_API_KEY=%s\n' "${BACKEND_REAL_API_KEY}" > .env.backend-real

      - name: Prepare backend-real dependencies
        run: |
          set -euo pipefail
          npm run backend-real:bootstrap

      - name: Run lane-backend-real-core
        run: npm run lane:backend-real:core

      - name: Upload backend-real core artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-backend-real-core-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/backend-real/runs/**
            artifacts/mock-lane/runs/**
            test-results/**
            playwright-report/**
