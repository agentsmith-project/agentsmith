components:
  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    streamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    endpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
    libraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "UNAUTHORIZED"
            message: "Missing or invalid authorization token"
    Forbidden:
      description: Forbidden - Valid token but insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "PERMISSION_DENIED"
            message: "You do not have permission to perform this action"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RESOURCE_NOT_FOUND"
            message: "The requested resource does not exist"
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "VALIDATION_ERROR"
            message: "Invalid request parameters"
    Conflict:
      description: Conflict - Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RESOURCE_ALREADY_EXISTS"
            message: "A resource with this identifier already exists"
    RateLimited:
      description: Too Many Requests - Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "RATE_LIMIT_EXCEEDED"
            message: "Rate limit exceeded. Please retry after a few seconds"
    QuotaExceeded:
      description: Quota Exceeded - Resource quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "QUOTA_EXCEEDED"
            message: "Resource quota exceeded"
    InternalError:
      description: Internal Server Error - Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error_code: "INTERNAL_ERROR"
            message: "An unexpected error occurred. Please try again later"
