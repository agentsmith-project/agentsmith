# Edit before apply:
# - keep namespace `mbos` unless your target namespace differs
# - this service account is only for cluster-deploy automation
# - use it to mint config/kubeconfig for the deployment operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentsmith-deploy
  namespace: mbos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentsmith-deploy
  namespace: mbos
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentsmith-deploy
  namespace: mbos
subjects:
  - kind: ServiceAccount
    name: agentsmith-deploy
    namespace: mbos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentsmith-deploy
