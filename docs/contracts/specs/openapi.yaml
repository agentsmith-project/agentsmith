        project_id:
          type: string
        intended_use:
          type: string
          enum: [task_events, chat_stream, other]
    SSETicketResponse:
      type: object
      required:
        - ticket
        - expires_at
        - sso_url
        - max_connections
      properties:
        ticket:
          type: string
          description: Short-lived token (UUID)
        expires_at:
          type: string
          format: date-time
          description: Ticket expiration time (~5 minutes)
        sso_url:
          type: string
          description: SSE endpoint URL with ticket
        max_connections:
          type: integer
          description: Single-use enforcement
          enum: [1]
    # ============================================================
    # Epic C1: Cost & Quota Dashboard Schemas
    # ============================================================
    QuotaOverview:
