apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentsmith-manager
  namespace: mbos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentsmith-manager
  namespace: mbos
rules:
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentsmith-manager
  namespace: mbos
subjects:
  - kind: ServiceAccount
    name: agentsmith-manager
    namespace: mbos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentsmith-manager
