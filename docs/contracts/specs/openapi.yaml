  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks:
    get:
      tags:
        - Agent Tasks
      operationId: listTasks
      summary: List agent tasks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Agent Tasks
      operationId: createTask
      summary: Create an agent task
      description: Creates an agent task and binds its runner at creation time. Omitting bound_runner_id uses the default managed runner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Agent task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Unsupported legacy task runner selector field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: FILE_LIBRARY_FORBIDDEN or insufficient task permission
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryForbiddenError"
                  - $ref: "#/components/schemas/ApiError"
        "404":
          description: FILE_LIBRARY_NOT_FOUND or TASK_FILE_TEMPLATE_NOT_FOUND
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryNotFoundError"
                  - $ref: "#/components/schemas/TaskFileTemplateNotFoundError"
        "409":
          description: FILE_LIBRARY_DELETING, FILE_LIBRARY_NOT_READY, TASK_FILE_TEMPLATE_UNPUBLISHED, AGENT_TASK_FILE_LIBRARY_IN_USE, AGENT_TASK_WORKSPACE_BINDING_CONFLICT, or runner binding failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryDeletingError"
                  - $ref: "#/components/schemas/FileLibraryNotReadyError"
                  - $ref: "#/components/schemas/TaskFileTemplateUnpublishedError"
                  - $ref: "#/components/schemas/AgentTaskFileLibraryInUseError"
                  - $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/AgentRunnerResolutionError"
        "422":
          description: AGENT_TASK_WORKSPACE_MODE_INVALID, AGENT_TASK_WORKSPACE_FILE_LIBRARY_REQUIRED, or runner binding validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentTaskWorkspaceModeInvalidError"
                  - $ref: "#/components/schemas/AgentTaskWorkspaceFileLibraryRequiredError"
                  - $ref: "#/components/schemas/AgentTaskFileTemplateRequiredError"
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/InvalidBindingTargetError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}:
    get:
      tags:
        - Agent Tasks
      operationId: getTask
      summary: Get an agent task
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Agent Tasks
      operationId: updateTask
      summary: Update an agent task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Unsupported immutable runner or HOME binding field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: AGENT_TASK_WORKSPACE_BINDING_CONFLICT or task state conflict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
                  - $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - Agent Tasks
      operationId: deleteTask
      summary: Delete an agent task and release its task HOME binding
      description: Deletes task metadata/history and releases the file-library HOME binding. The file library and files are retained.
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "204":
          description: Task deleted with no response body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: AGENT_TASK_DELETE_BLOCKED or AGENT_TASK_WORKSPACE_BINDING_CONFLICT
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentTaskDeleteBlockedError"
                  - $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
                  - $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/activity:
    get:
      tags:
        - Agent Tasks
      operationId: listTaskActivity
      summary: List agent task activity
      description: Returns user intent and runner output activity for an Agent Task. Public activity items do not expose Chat message roles.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskActivityItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/runner-binding-options:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Agent Tasks
      operationId: getTaskRunnerBindingOptions
      summary: Get display-safe task runner binding options
      description: Returns display-safe task runner binding options for task creation. Final authorization, readiness, endpoint, and capability checks are recomputed on CreateTask.
      responses:
        "200":
          description: Display-safe task runner binding options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRunnerBindingOptionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/runs:
    post:
      tags:
        - Agent Tasks
      operationId: startTaskRun
      summary: Start an agent task run
      description: Starts an Agent Task run from user intent and optional input references. Backend runner resolution is authoritative; clients do not send runner selectors or message roles.
      responses:
        "200":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActivityItem"
        "400":
          description: Unsupported legacy task runner selector or message field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: TASK_STREAM_CONFLICT, task_terminal_sessions_active, or agent runner resolution failure
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TaskStreamConflictResponse"
                  - $ref: "#/components/schemas/AgentRunnerResolutionError"
                  - $ref: "#/components/schemas/ApiError"
        "422":
          description: Validation error (for example TASK_AGENT_ENDPOINT_NOT_CONFIGURED)
        "502":
          description: Agent task runner execution error
            (AGENT_OFFLINE/AGENT_PROTOCOL_ERROR/AGENT_UPSTREAM_ERROR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTaskRunRequest"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/cancel:
    post:
      tags:
        - Agent Tasks
      operationId: cancelTaskRun
      description: Requests cancellation of the currently active agent task run.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCancelRunRequest"
      responses:
        "202":
          description: Cancel request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCancelRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: task_not_found
        "409":
          description: TASK_RUN_NOT_ACTIVE
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/TaskCancelRunUnavailableResponse"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/artifacts:
    get:
      tags:
        - Agent Tasks
      operationId: listTaskArtifacts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - task_id
                    - type
                    - created_at
                  properties:
                    id:
                      type: string
                    task_id:
                      type: string
                    type:
                      type: string
                      enum:
                        - text
                        - image
                        - file
                        - other
                    task_relative_path:
                      type: string
                      description: Relative path inside the agent task working directory for
                        execution-originated artifacts. The backend only accepts
                        artifact paths under `.artifacts`.
                    title:
                      type: string
                    content:
                      type: string
                    thumbnail_url:
                      type: string
                    file_size:
                      type: integer
                      minimum: 0
                    mime_type:
                      type: string
                    created_at:
                      type: string
                      format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/workspace-access:
    post:
      tags:
        - Agent Tasks
      operationId: getTaskWorkspaceAccess
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - task_id
                  - runtime_profile
                  - file_library_id
                  - file_library_name
                  - task_home_binding
                properties:
                  task_id:
                    type: string
                  runtime_profile:
                    type: string
                    enum:
                      - managed
                      - developer
                  file_library_id:
                    type: string
                  file_library_name:
                    type: string
                  task_home_binding:
                    type: object
                    additionalProperties: false
                    required:
                      - binding_id
                      - provider
                      - mode
                      - task_id
                      - file_library_id
                      - task_home_segment
                      - generation
                      - holder
                      - paths
                    properties:
                      binding_id:
                        type: string
                      provider:
                        type: string
                        enum:
                          - afscp
                      mode:
                        type: string
                        enum:
                          - pre_mounted
                      task_id:
                        type: string
                      file_library_id:
                        type: string
                      task_home_segment:
                        type: string
                      generation:
                        type: string
                      holder:
                        type: object
                        additionalProperties: false
                        required:
                          - holder_id
                          - holder_kind
                          - binding_generation
                          - lease_epoch
                          - issued_at
                          - expires_at
                        properties:
                          holder_id:
                            type: string
                          holder_kind:
                            type: string
                            enum:
                              - runner_workspace
                              - terminal_session
                              - notebook_run
                          binding_generation:
                            type: string
                          lease_epoch:
                            type: string
                          issued_at:
                            type: string
                            format: date-time
                          expires_at:
                            type: string
                            format: date-time
                      paths:
                        type: object
                        additionalProperties: false
                        required:
                          - task_home_path
                          - workspace_path
                          - artifacts_path
                          - library_root_path
                        properties:
                          task_home_path:
                            type: string
                          workspace_path:
                            type: string
                          artifacts_path:
                            type: string
                          library_root_path:
                            type: string
                            enum:
                              - "."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: FILE_LIBRARY_FORBIDDEN or insufficient task permission
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryForbiddenError"
                  - $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FILE_LIBRARY_DELETING, FILE_LIBRARY_NOT_READY, TASK_HOME_BINDING_UNAVAILABLE_FOR_DEVELOPER_RUNNER, or AGENT_TASK_WORKSPACE_BINDING_CONFLICT
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryDeletingError"
                  - $ref: "#/components/schemas/FileLibraryNotReadyError"
                  - $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
                  - $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}/workspace-access/release:
    post:
      tags:
        - Agent Tasks
      operationId: releaseTaskWorkspaceAccess
      description: Internal runner callback that releases a task HOME holder fence after the runner/session no longer needs path access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - holder_id
                - file_library_id
                - binding_generation
                - lease_epoch
              properties:
                holder_id:
                  type: string
                  minLength: 1
                  pattern: \S
                file_library_id:
                  type: string
                  minLength: 1
                  pattern: \S
                binding_generation:
                  type: string
                  minLength: 1
                  pattern: ^[1-9][0-9]*$
                lease_epoch:
                  type: string
                  minLength: 1
                  pattern: \S
      responses:
        "200":
          description: Holder release accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - released
                properties:
                  released:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Holder fence mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
