name: Runner Contract Artifact

on:
  workflow_dispatch:

concurrency:
  group: runner-contract-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  produce-runner-contract-artifact:
    name: produce-runner-contract-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runner contract workspace package
        run: npm run build -w @mbos/agent-runner-contract

      - name: Produce runner contract artifact
        run: npx tsx scripts/governance/runner-contract-artifact.ts

      - name: Upload runner contract artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentsmith-runner-contract-artifact
          if-no-files-found: error
          path: |
            artifacts/runner-contract/runner-contract-artifact.json
            artifacts/runner-contract/*.tgz

  consume-runner-contract-artifact:
    name: consume-runner-contract-artifact
    needs: produce-runner-contract-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download runner contract artifact
        uses: actions/download-artifact@v7
        with:
          name: agentsmith-runner-contract-artifact
          path: artifacts/runner-contract-download

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runner contract workspace package
        run: npm run build -w @mbos/agent-runner-contract

      - name: Check downloaded runner contract artifact
        run: npx tsx scripts/contracts/check-agent-runner-contract-artifact.ts --artifact-root artifacts/runner-contract-download

      - name: Non-readiness scope
        run: |
          set -euo pipefail
          # This workflow only produces and consumes the runner contract artifact descriptor; it is not release readiness.
          test -f artifacts/runner-contract-download/runner-contract-artifact.json
