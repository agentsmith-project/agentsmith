# Edit before apply:
# - replace every ALL_CAPS placeholder with real values
# - keep namespace aligned with the workload namespace, currently `mbos`
# - this secret is consumed by the JuiceFS storage class and CSI workflow
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-csi-secret
  namespace: mbos
type: Opaque
stringData:
  name: mbos-jfs
  metaurl: postgres://POSTGRES_USER:POSTGRES_PASSWORD@K8S_EXTERNAL_POSTGRES_HOST:K8S_EXTERNAL_POSTGRES_PORT/POSTGRES_DB?sslmode=disable
  storage: s3
  bucket: http://K8S_EXTERNAL_MINIO_HOST:K8S_EXTERNAL_MINIO_PORT/MINIO_BUCKET
  access-key: MINIO_ROOT_USER
  secret-key: MINIO_ROOT_PASSWORD
