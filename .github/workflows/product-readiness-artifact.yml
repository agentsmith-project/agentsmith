name: Product Readiness Artifact

on:
  workflow_dispatch:
    inputs:
      release_contract_artifact_name:
        description: "GitHub Actions artifact name containing agentsmith-release-contract.json"
        required: true
        default: "agentsmith-release-contract"
        type: string
      release_contract_run_id:
        description: "GitHub Actions run id that produced the release contract artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: product-readiness-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  product-readiness:
    name: product-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AGENTSMITH_PRODUCT_READINESS_ARTIFACT_NAME: agentsmith-product-readiness
      PRESET_ENDPOINT_API_KEY: ${{ secrets.PRESET_ENDPOINT_API_KEY || secrets.BACKEND_REAL_API_KEY }}
      RELEASE_CAMPAIGN_RUN_ID: product-readiness-${{ github.run_id }}
      RELEASE_CAMPAIGN_ROOT: artifacts/release-runs/product-readiness-${{ github.run_id }}
      PRODUCT_READINESS_ARTIFACT_STAGE: ${{ runner.temp }}/agentsmith-product-readiness/artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runner contract
        run: npm run build -w @mbos/agent-runner-contract

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [[ -z "${PRESET_ENDPOINT_API_KEY:-}" ]]; then
            echo "PRESET_ENDPOINT_API_KEY secret is required for product readiness artifact generation; BACKEND_REAL_API_KEY is accepted only as a temporary GitHub Actions secret rename fallback." >&2
            exit 1
          fi

      - name: Download release contract artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.release_contract_artifact_name }}
          run-id: ${{ inputs.release_contract_run_id }}
          path: ${{ runner.temp }}/agentsmith-product-readiness/input
          github-token: ${{ github.token }}

      - name: Verify release contract input
        env:
          RELEASE_CONTRACT_INPUT_PATH: ${{ runner.temp }}/agentsmith-product-readiness/input/agentsmith-release-contract.json
        run: |
          set -euo pipefail
          test -f "${RELEASE_CONTRACT_INPUT_PATH}"

      - name: Run product readiness
        env:
          RELEASE_CONTRACT_INPUT_PATH: ${{ runner.temp }}/agentsmith-product-readiness/input/agentsmith-release-contract.json
        run: |
          set -euo pipefail
          npm run product:ready -- --release-contract "${RELEASE_CONTRACT_INPUT_PATH}"

      - name: Verify product readiness handoff files
        if: success()
        run: |
          set -euo pipefail
          test -f "${RELEASE_CAMPAIGN_ROOT}/product-readiness/product-readiness-report.json"
          test -f "${RELEASE_CAMPAIGN_ROOT}/summary.json"
          test -f "${RELEASE_CAMPAIGN_ROOT}/gate-release-full/result.json"

      - name: Stage product readiness artifact
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${PRODUCT_READINESS_ARTIFACT_STAGE}"
          mkdir -p "${PRODUCT_READINESS_ARTIFACT_STAGE}"
          if [[ -d "${RELEASE_CAMPAIGN_ROOT}" ]]; then
            mkdir -p "${PRODUCT_READINESS_ARTIFACT_STAGE}/release-runs"
            rsync -a --prune-empty-dirs \
              --exclude='**/afscp-juicefs-cache/' \
              --exclude='**/next-dist/' \
              "${RELEASE_CAMPAIGN_ROOT}/" \
              "${PRODUCT_READINESS_ARTIFACT_STAGE}/release-runs/${RELEASE_CAMPAIGN_RUN_ID}/"
          fi
          if [[ -d test-results ]]; then
            rsync -a test-results/ "${PRODUCT_READINESS_ARTIFACT_STAGE}/test-results/"
          fi
          if [[ -d playwright-report ]]; then
            rsync -a playwright-report/ "${PRODUCT_READINESS_ARTIFACT_STAGE}/playwright-report/"
          fi

      - name: Upload product readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentsmith-product-readiness
          if-no-files-found: error
          path: |
            ${{ env.PRODUCT_READINESS_ARTIFACT_STAGE }}/**
