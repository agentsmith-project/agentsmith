      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/source-libraries/{libraryId}/objects/share-link:
    post:
      tags:
      - Sources
      operationId: post_sourceLibraryObjectsShareLink
      responses:
        '200':
