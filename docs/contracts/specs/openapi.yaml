openapi: 3.1.0
info:
  title: MBOS API
  version: 1.0.0
  description: Authoritative HTTP API contract for MBOS private-node deployment.
servers:
  - url: /
    description: same-origin
tags:
  - name: System
  - name: Workspaces
  - name: Projects
  - name: Chat
  - name: Agent Runners
  - name: Endpoints
  - name: Sources
  - name: Contracts
  - name: Credentials
  - name: Agent Tasks
    description: Agent task execution, terminal, artifact, and trace APIs
  - name: Authorization
    description: Unified authorization decision API
  - name: SSE
    description: Server-Sent Events ticket exchange
  - name: Governance
    description: Limit checks and audit export
  - name: LLM Runtime
    description: Provider/model routing, unified proxy, and pricing control plane
paths:
  /api/v1/openapi.json:
    get:
      tags:
        - Contracts
      operationId: getOpenApiSpec
      summary: Get OpenAPI spec
      responses:
        "200":
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/asyncapi.json:
    get:
      tags:
        - Contracts
      operationId: getAsyncApiSpec
      summary: Get AsyncAPI spec
      responses:
        "200":
          description: AsyncAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/context:
    get:
      tags:
        - Agent Tasks
      operationId: getContextEntry
      summary: Get a runner support Context Store entry projection
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - member
              - task
              - project_member
              - project
              - workspace
        - name: key
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Context entry projection
          content:
            application/json:
              schema: &ContextEntryProjectionSchema
                type: object
                additionalProperties: false
                required:
                  - id
                  - scope
                  - key
                  - content
                  - content_type
                  - read_only
                  - updated_at
                  - updated_by
                properties:
                  id:
                    type: string
                    minLength: 1
                    pattern: \S
                  scope:
                    type: string
                    minLength: 1
                    pattern: \S
                  key:
                    type: string
                    minLength: 1
                    pattern: \S
                  content:
                    type: string
                  content_type:
                    type: string
                    enum:
                      - text
                      - json
                      - markdown
                      - yaml
                  user_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  task_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  project_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  workspace_id:
                    oneOf:
                      - type: string
                      - type: "null"
                  read_only:
                    type: boolean
                  updated_at:
                    type: string
                    minLength: 1
                    pattern: \S
                    format: date-time
                  updated_by:
                    type: string
                    minLength: 1
                    pattern: \S
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/context/list:
    get:
      tags:
        - Agent Tasks
      operationId: listContextEntries
      summary: List runner support Context Store entry projections
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - member
              - task
              - project_member
              - project
              - workspace
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: task_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Context entry projection list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items: *ContextEntryProjectionSchema
                  total:
                    type: integer
                    minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/context/managed-credentials/{provider}/refresh:
    post:
      tags:
        - Agent Tasks
      operationId: refreshManagedCredentialContextEntry
      summary: Refresh a managed credential Context Store entry projection
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Refreshed managed credential projection
          content:
            application/json:
              schema: *ContextEntryProjectionSchema
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Managed credential refresh is not supported for the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces:
    get:
      tags:
        - Workspaces
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/workspaces/{workspaceId}/projects:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      tags:
        - Projects
      operationId: listProjects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Projects
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: FILE_LIBRARY_FORBIDDEN or insufficient task permission
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryForbiddenError"
                  - $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FILE_LIBRARY_DELETING, FILE_LIBRARY_NOT_READY, or AGENT_TASK_WORKSPACE_BINDING_CONFLICT
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileLibraryDeletingError"
                  - $ref: "#/components/schemas/FileLibraryNotReadyError"
                  - $ref: "#/components/schemas/AgentTaskWorkspaceBindingConflictError"
                  - $ref: "#/components/schemas/ApiError"
  /api/v1/workspaces/{workspaceId}/governable-projects:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
    get:
      tags:
        - Projects
      operationId: listGovernableProjects
      summary: List projects visible to workspace governance admins
      responses:
        "200":
          description: Governable project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Chat
      operationId: listChatSessions
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Chat
      operationId: createChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sessionId"
    patch:
      tags:
        - Chat
      operationId: updateChatSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatSessionRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Chat
      operationId: deleteChatSession
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sessionId"
    post:
      tags:
        - Chat
      operationId: createChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatMessageRequest"
      responses:
        "200":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/messages/stream:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sessionId"
    post:
      tags:
        - Chat
      operationId: streamChatMessage
      summary: Create message and stream assistant response via SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatMessageRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          description: CHAT_SESSION_STREAM_CONFLICT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatStreamConflictResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/attachments:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sessionId"
    post:
      tags:
        - Chat
      operationId: uploadChatAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/chat/sessions/{sessionId}/stop:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/sessionId"
    post:
      tags:
        - Chat
      operationId: stopChatStreamBySession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStopRequest"
      responses:
        "202":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionStopResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Agent Runners
      operationId: listAgentRunners
      summary: List agent runners
      responses:
        "200":
          description: Agent runner list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerListResponse"
    post:
      tags:
        - Agent Runners
      operationId: createAgentRunner
      summary: Create an agent runner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunnerRequest"
      responses:
        "201":
          description: Agent runner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunner"
        "400":
          description: Unsupported legacy agent runner field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
    get:
      tags:
        - Agent Runners
      operationId: getAgentRunner
      responses:
        "200":
          description: Agent runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunner"
    patch:
      tags:
        - Agent Runners
      operationId: updateAgentRunner
      summary: Update an agent runner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRunnerRequest"
      responses:
        "200":
          description: Agent runner updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunner"
        "400":
          description: Unsupported legacy agent runner field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
    delete:
      tags:
        - Agent Runners
      operationId: deleteAgentRunner
      responses:
        "204":
          description: Deleted
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}/connection-info:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
    get:
      tags:
        - Agent Runners
      operationId: getAgentRunnerConnectionInfo
      responses:
        "200":
          description: Connection info
          content:
            application/json:
              schema:
                type: object
                required:
                  - ws_url
                  - agent_runner_id
                  - protocol_version
                  - heartbeat_interval_sec
                properties:
                  ws_url:
                    type: string
                  agent_runner_id:
                    type: string
                  protocol_version:
                    type: string
                  heartbeat_interval_sec:
                    type: integer
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}/keys:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
    get:
      tags:
        - Agent Runners
      operationId: listAgentRunnerKeys
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerKeyListResponse"
    post:
      tags:
        - Agent Runners
      operationId: createAgentRunnerKey
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentRunnerKeyResponse"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
      - $ref: "#/components/parameters/keyId"
    delete:
      tags:
        - Agent Runners
      operationId: deleteAgentRunnerKey
      responses:
        "204":
          description: Deleted
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}/test-connection:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
    post:
      tags:
        - Agent Runners
      operationId: testAgentRunnerConnection
      summary: Test Developer runner connection freshness
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunnerTestConnectionRequest"
      responses:
        "200":
          description: Display-safe Developer runner connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerTestConnectionResponse"
        "400":
          description: Unsupported test connection request field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BadRequest"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-runners/{agentRunnerId}/test-task-runs:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/agentRunnerId"
    post:
      tags:
        - Agent Runners
      operationId: createAgentRunnerTestTaskRun
      summary: Start a dedicated Developer runner test task run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunnerTestTaskRunRequest"
      responses:
        "202":
          description: Runner test task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerTestTaskRunAcceptedResponse"
        "400":
          description: Unsupported test task request field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "409":
          description: Runner test task failed closed before dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunnerTestTaskRunUnavailableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/agent-task-model-setting:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Agent Tasks
      operationId: getAgentTaskModelSetting
      summary: Get Agent task model setting readiness
      description: >
        Returns a permission-shaped project Agent task model setting view.
        Task-only viewers receive display-safe readiness only; governance
        viewers may also receive setting details and management actions.
      responses:
        "200":
          description: Agent task model setting readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskModelSettingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags:
        - Agent Tasks
      operationId: updateAgentTaskModelSetting
      summary: Update the project Agent task model setting
      description: >
        Updates the project Agent task model setting to use the selected
        Endpoint default model. The backend recomputes Endpoint row action
        eligibility and rejects stale revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentTaskModelSettingRequest"
      responses:
        "200":
          description: Agent task model setting updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskModelSettingResponse"
        "400":
          description: Unsupported model-setting request field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedFieldError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden or Agent task model policy blocker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/AgentTaskModelResolutionError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale Agent task model setting revision or setup blocker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AgentTaskModelSettingConflictError"
                  - $ref: "#/components/schemas/AgentTaskModelResolutionError"
        "422":
          description: Invalid Agent task model setting request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskModelSettingValidationError"
        "429":
          description: Agent task model policy rate or spend limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskModelResolutionError"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/endpoints:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
    get:
      tags:
        - Endpoints
      operationId: listEndpoints
      responses:
        "200":
          description: Endpoint list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endpoint"
    post:
      tags:
        - Endpoints
      operationId: createEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
  /api/v1/workspaces/{workspaceId}/projects/{projectId}/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/workspaceId"
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/endpointId"
    get:
      tags:
        - Endpoints
      operationId: getEndpoint
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
    put:
      tags:
        - Endpoints
      operationId: updateEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
    delete:
      tags:
        - Endpoints
