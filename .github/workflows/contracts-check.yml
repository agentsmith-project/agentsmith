name: Contracts Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify AGENTS instructions contract
        run: |
          set -euo pipefail
          test -f AGENTS.md
          grep -q "# AGENTS.md" AGENTS.md

      - name: Verify current workflow contracts
        run: |
          set -euo pipefail
          test -f .env.local-manual.example
          test -f .env.backend-real.example
          test -f infra/deploy/unified/env/site.env.example

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run gate-fast
        run: npm run gate:fast

      - name: Run permission contract drift check
        run: npm run contracts:check

      - name: Run engineering governance manifest checks
        run: |
          set -euo pipefail
          npm run contracts:check-current-workflows
          npm run contracts:check-current-gates
          npm run contracts:check-engineering-governance

      - name: Upload contract gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contracts-check-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/mock-lane/runs/**
            !artifacts/mock-lane/runs/**/next-dist/**
            test-results/**
            playwright-report/**
