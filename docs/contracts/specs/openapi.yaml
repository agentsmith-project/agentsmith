      type: string
      description: Alert notification status
      enum: [firing, resolved, silenced]
    AlertContext:
      type: object
      description: Alert context information
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        resource_name:
          type: string
        end_user_id:
          type: string
    AlertDelivery:
      type: object
      description: Alert delivery status
      required:
        - in_app_sent
        - webhook_sent
      properties:
        in_app_sent:
          type: boolean
        in_app_seen_at:
          type: string
          format: date-time
        webhook_sent:
          type: boolean
        webhook_status:
          type: integer
          description: HTTP status code from webhook delivery
        webhook_error:
          type: string
          description: Error message if webhook delivery failed
    SilenceNotificationRequest:
      type: object
      description: Silence notification request
      properties:
        duration_minutes:
          type: integer
          minimum: 1
          description: Duration in minutes. If omitted, silence indefinitely.
    AlertRulesListResponse:
      type: object
      description: Paginated list of alert rules
      required:
        - items
        - total
        - page
        - page_size
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        has_more:
          type: boolean
