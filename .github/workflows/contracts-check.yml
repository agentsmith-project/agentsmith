name: Contracts Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify AGENTS symlink contract
        run: |
          set -euo pipefail
          test -L AGENTS.md
          target="$(readlink AGENTS.md)"
          if [[ "${target}" != "CLAUDE.md" ]]; then
            echo "AGENTS.md must symlink to CLAUDE.md, got: ${target}" >&2
            exit 1
          fi

      - name: Verify current workflow contracts
        run: |
          set -euo pipefail
          test -f .env.local-manual.example
          test -f .env.backend-real.example
          test -f infra/deploy/demo/env/site.env.example

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run gate-fast
        run: make gate-fast

      - name: Run permission contract drift check
        run: npm run contracts:check

      - name: Run engineering baseline sync check
        run: npm run contracts:check-engineering-sync
