          type: string
          description: Time bucket identifier (ISO 8601 or formatted date)
        requests:
          type: number
          minimum: 0
        tokens:
          type: number
          minimum: 0
        errors:
          type: number
          minimum: 0
        estimated_cost:
          type: number
          description: Estimated cost in USD
        duration_p95_ms:
          type: number
          description: P95 response time in milliseconds
        bytes_in:
          type: number
          minimum: 0
        bytes_out:
          type: number
          minimum: 0
    ResourceCostBreakdown:
      type: object
      required:
        - resource_type
        - resource_id
        - resource_name
        - requests
        - estimated_cost
        - percentage_of_total
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        resource_name:
          type: string
        requests:
          type: number
          minimum: 0
        tokens:
          type: number
          minimum: 0
        estimated_cost:
          type: number
          description: Estimated cost in USD
        percentage_of_total:
          type: number
          minimum: 0
          maximum: 100
