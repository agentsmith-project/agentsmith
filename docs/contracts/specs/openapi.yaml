        - quota_limit
        - quota_reset_at
        - percentage_used
        - quota_unit
      properties:
        resource_type:
          type: string
          enum: [endpoint, source_library, agent]
        resource_id:
          type: string
        resource_name:
          type: string
        quota_used:
          type: number
          minimum: 0
        quota_limit:
          type: number
          minimum: 0
        quota_reset_at:
          type: string
          format: date-time
        percentage_used:
          type: number
          minimum: 0
          maximum: 100
        quota_unit:
          type: string
          enum: [tokens, requests, bytes, files]
    UsageTimeseriesRequest:
      type: object
