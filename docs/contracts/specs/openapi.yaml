        - start_time
        - end_time
      properties:
        start_time:
          type: string
          format: date-time
          description: Start of time range (ISO 8601)
        end_time:
          type: string
          format: date-time
          description: End of time range (ISO 8601)
        granularity:
          type: string
          enum: [hour, day]
          default: hour
          description: Time granularity for aggregation
        resource_type:
          type: string
          description: Filter by resource type
        resource_id:
          type: string
          description: Filter by specific resource
        end_user_id:
          type: string
          description: Filter by end user
    UsageTimeseriesResponse:
      type: object
      description: Usage/cost time series data
      required:
        - time_range
        - data_points
      properties:
        time_range:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            granularity:
              type: string
              enum: [hour, day]
        data_points:
          type: array
          items:
            $ref: '#/components/schemas/UsageDataPoint'
        resource_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ResourceCostBreakdown'
        total_cost:
          type: number
          description: Total estimated cost in USD
    UsageDataPoint:
      type: object
      required:
        - time_bucket
        - requests
        - errors
